---
# Playbook d'exécution/test du rôle gpu_cdi, ciblant localhost — même
# patron que roles/gpu_mux/gpu_mux.yml et roles/recovery/recovery.yml.
# Ce rôle écrit dans /etc/ (dépôt, paquets, spécification CDI) : toute
# exécution réelle (pas --check) exige une élévation de privilège. Ce
# compte n'a pas de règle NOPASSWD — exécuter avec
# `ansible-playbook --ask-become-pass roles/gpu_cdi/gpu_cdi.yml`.
- name: gpu_cdi — accès GPU rootless par CDI natif (D7/D8)
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: "{{ playbook_dir }}"
