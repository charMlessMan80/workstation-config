---
galaxy_info:
  role_name: editor
  author: Mickael Mahieu
  description: >-
    Installe Helix (terminal) et Kate (graphique) — choix de
    l'opérateur D12, docs/editor.md, depuis fedora/updates uniquement,
    jamais terra. N'installe jamais node/npm ni aucun serveur de
    langage (D11) — garde vérifiée dans les deux sens après exécution.
    Déploie une configuration sobre pour Helix
    (~/.config/helix/config.toml, aucun serveur de langage inscrit) et
    pour Kate (clés nommées via kwriteconfig6, jamais une copie de
    fichier — outils externes pointant explicitement le binaire
    ansible-lint/yamllint du venv D3a, pas un second binaire). Ne
    touche jamais sudoers, /etc/cdi/, kwinrc, kwinrulesrc,
    gpu_mux_mode. Ne redémarre jamais, ne déconnecte jamais la session.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Fedora
      versions:
        - "44"
dependencies: []
