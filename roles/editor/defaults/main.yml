---
# [CORRIGÉ le 2026-08-08, COR-2] Choix de l'opérateur (D13,
# docs/machine-facts.md § Décisions — voir la note de renumérotation
# dans le rapport de ce livrable, la demande désignait ce choix « D12 »
# mais ce numéro était déjà pris, renumérotée D13) : Helix en
# terminal, Kate en graphique. Motif complet : docs/editor.md § D13 —
# résumé ici, Helix embarque coloration tree-sitter et configuration
# complète sans gestionnaire de greffons (contrairement à Neovim, dont
# l'intérêt réel suppose des greffons récupérés hors dépôts) ; Kate est
# natif KF6, déjà intégré à la session Plasma, avec terminal embarqué
# et mécanisme d'outils externes. Zed et Cursor écartés (magasin
# d'extensions propre, télémétrie, dépendance à terra).
editor_helix_package: helix
editor_kate_package: kate

# [RESSERRÉE le 2026-08-10, D24] ÉTAIT : garde D12 vérifiant l'absence
# totale de `node`/`npm` sur le PATH — cassait dès l'installation de
# GitHub Copilot CLI (D24, révision de D12, docs/machine-facts.md §
# Décisions), qui ouvre npm sur ce poste pour un usage légitime et
# distinct (roles/copilot_cli/). npm lui-même n'a jamais été la
# préoccupation réelle de D12 : ce qui devait rester fermé, c'est
# qu'AUCUN SERVEUR DE LANGAGE ne provienne de ce canal pour Helix/Kate,
# et que `lsp-ai` reste le binaire compilé depuis les sources (D19),
# jamais un substitut installé par npm. Cette contrainte a plus de sens
# maintenant que npm est légitimement présent : la tentation de
# résoudre `yaml-language-server`/`ansible-language-server` par
# `npm install -g` devient réelle, alors qu'elle ne l'était pas tant
# que npm était absent du système. Ni l'un ni l'autre n'est empaqueté
# dans les onze dépôts (constaté en EDI-0, docs/editor.md § 1.2) — les
# installer supposerait toujours un modèle de dépendances transitives
# hors du contrôle rpm, npm présent ou non. Contrepartie assumée,
# inchangée : pas de complétion ni de diagnostic YAML/Ansible dans
# l'éditeur — `ansible-lint`/`yamllint` (venv D3a) appelés en ligne de
# commande ou via outil externe Kate pointant explicitement ce binaire.
# Démontrée dans les deux sens après resserrement — docs/editor.md §
# Copilot CLI (les deux démonstrations d'origine, § 2.3, ne portaient
# que sur `node`/`npm`, invalidées par cette révision, pas rejouables
# telles quelles).
editor_forbidden_lsp_servers:
  - yaml-language-server
  - ansible-language-server

# Chemin attendu du binaire lsp-ai compilé (D19) — même valeur que
# `completion_bin_dir`/`completion_bin_name` dans
# `roles/completion/defaults/main.yml`, jamais importée directement
# (rôles autonomes, pas de dépendance croisée déclarée) : dupliquée ici
# à dessein, comme une constante nommée deux fois plutôt qu'un couplage
# implicite entre rôles. Si les deux divergent un jour, chacune casse
# sa propre garde plutôt que de se référencer silencieusement l'une
# l'autre.
editor_lsp_ai_expected_path: "{{ ansible_facts.env.HOME }}/.local/bin/lsp-ai"

# [RETIRÉE le 2026-08-10, D24] La variable portait ici le nom
# `editor_forbidden_binaries` ([node, npm]) — remplacée par
# `editor_forbidden_lsp_servers` ci-dessus, motif complet dans le
# commentaire qui le précède. Marqué ici, pas supprimé sans trace, pour
# qu'une recherche de l'ancien nom retrouve l'explication plutôt qu'un
# silence.

# Binaire ansible-lint faisant autorité (D3a, docs/ansible-chain.md) —
# jamais un second `ansible-lint`/`yamllint` installé en paquet système
# à côté. yamllint est déjà présent dans ce venv (1.38.0, vérifié avant
# ce livrable) : aucun paquet yamllint n'est installé par ce rôle non
# plus, pour la même raison.
editor_ansible_lint_venv: "{{ ansible_facts.env.HOME }}/.venvs/ansible-lint"

editor_config_home: "{{ ansible_facts.env.HOME }}/.config"
editor_helix_config_dir: "{{ editor_config_home }}/helix"
editor_kate_config_dir: "{{ editor_config_home }}/kate"
editor_kate_externaltools_dir: "{{ editor_kate_config_dir }}/externaltools"

# Greffons Kate à activer — kate-plugins (dépendance faible, installée
# par ce rôle) ne les active PAS lui-même : vérifié par lecture directe
# de ~/.config/katerc après une première ouverture de Kate sans aucune
# configuration, le 2026-08-06 — aucun groupe [Kate Plugins] n'existe
# tant que rien n'a jamais été activé. Groupe et clé sourcés dans le
# code (pas supposés) : `apps/lib/katepluginmanager.cpp`, tag v26.04.3
# (version installée exacte) — groupe « Kate Plugins », clé =
# KatePluginInfo::saveName(), qui renvoie le nom de base du fichier
# .so du greffon (QFileInfo(metaData.fileName()).baseName()) ; vérifié
# par lecture directe des bibliothèques installées
# (/usr/lib64/qt6/plugins/kf6/ktexteditor/*.so — chaîne `library=` dans
# le fichier .rc intégré de katekonsoleplugin, confirmée). Trois
# greffons activés : outils externes (nécessaire pour appeler
# ansible-lint/yamllint sans serveur de langage, § D12) et terminal
# intégré (cité comme motif de choix de Kate en D13 — sans l'activer,
# ce motif ne serait pas vrai). **[CORRIGÉ le 2026-08-08, KAT-1] ÉTAIT** :
# « Le greffon client LSP n'est PAS activé : D12 interdit tout serveur
# de langage à lui connecter, l'activer sans rien à connecter n'aurait
# aucun effet utile » — vrai tant qu'aucun serveur LSP n'existait sur ce
# poste (D12 ferme npm, pas `lsp-ai`). Depuis D19/D20 (CMP-1), `lsp-ai`
# est quelque chose à lui connecter — activé ici (`lspclientplugin`,
# nom de base sourcé de la même façon), câblé par `roles/completion/`
# (`~/.config/kate/lspclient/settings.json`, jamais ce fichier) — D12
# reste en vigueur, aucun serveur `npm` n'est ouvert par ce changement.
editor_kate_lspclient_plugin: lspclientplugin
editor_kate_plugins:
  - externaltoolsplugin
  - katekonsoleplugin
  - "{{ editor_kate_lspclient_plugin }}"

# Outils externes Kate — un fichier par outil sous
# editor_kate_externaltools_dir, groupe [General], clés sourcées dans
# le code (`addons/externaltools/kateexternaltool.cpp`, tag v26.04.3) :
# category/name/executable/arguments/mimetypes/save/output/trigger.
# `arguments` utilise `%{Document:FilePath}` — syntaxe de substitution
# de variable KTextEditor sourcée dans
# `src/utils/katevariableexpansionmanager.cpp` (ktexteditor, tag
# v6.28.0, version installée exacte) : délimiteurs `%{` / `}`,
# variable `Document:FilePath` = chemin complet du document courant.
# `mimetypes` = `application/yaml`, relevé par lecture locale
# (`xdg-mime query filetype`) sur un fichier .yml de ce dépôt, pas
# supposé. `save=CurrentDocument` (le fichier est sauvegardé avant
# l'appel — sinon l'outil linterait une version obsolète sur disque).
# `output=DisplayInPane` (panneau de sortie de Kate, pas d'insertion
# dans le document). `trigger=None` (appel manuel seulement — jamais
# automatique à la sauvegarde, pour ne jamais surprendre l'opérateur
# par un lancement qu'il n'a pas demandé).
# « keys » est une LISTE de {key, value} (pas un dict) — même patron
# que desktop_kwin_rule_keys (roles/desktop/), pour pouvoir la parcourir
# avec `subelements` dans tasks/main.yml.
editor_kate_tools:
  - filename: ansible-lint-d3a
    keys:
      - {key: category, value: Ansible}
      - {key: name, value: "ansible-lint (venv D3a)"}
      - {key: executable, value: "{{ editor_ansible_lint_venv }}/bin/ansible-lint"}
      - {key: arguments, value: "%{Document:FilePath}"}
      - {key: mimetypes, value: application/yaml}
      - {key: save, value: CurrentDocument}
      - {key: output, value: DisplayInPane}
      - {key: trigger, value: "None"}
  - filename: yamllint-d3a
    keys:
      - {key: category, value: Ansible}
      - {key: name, value: "yamllint (venv D3a)"}
      - {key: executable, value: "{{ editor_ansible_lint_venv }}/bin/yamllint"}
      - {key: arguments, value: "%{Document:FilePath}"}
      - {key: mimetypes, value: application/yaml}
      - {key: save, value: CurrentDocument}
      - {key: output, value: DisplayInPane}
      - {key: trigger, value: "None"}
