---
# Playbook d'exécution/test du rôle editor, ciblant localhost — même
# patron que roles/desktop/desktop.yml et les rôles précédents. Écrit
# dans /usr (paquets helix/kate, via dnf) et dans $HOME de
# l'utilisateur courant (~/.config/helix, ~/.config/kate) :
# l'installation du paquet exige une élévation de privilège, le reste
# non. Ce compte porte une règle NOPASSWD depuis le 2026-08-05 (D9,
# docs/machine-facts.md § Décisions) — les tâches become: true de ce
# rôle s'exécutent donc sans invite.
- name: Editor — Helix et Kate, sans serveur de langage npm (D12, D13)
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: "{{ playbook_dir }}"
