---
# Playbook d'exécution/test du rôle desktop, ciblant localhost — même
# patron que roles/recovery/recovery.yml, roles/gpu_mux/gpu_mux.yml,
# roles/gpu_cdi/gpu_cdi.yml. Écrit dans /usr (paquet kitty, via dnf) et
# dans $HOME de l'utilisateur courant (~/.config/kitty,
# ~/.config/kwinrulesrc, ~/.config/autostart) : l'installation du paquet
# exige une élévation de privilège, le reste non. Ce compte porte une
# règle NOPASSWD depuis le 2026-08-05 (décision D9,
# docs/machine-facts.md § Décisions) — les tâches become: true de ce
# rôle s'exécutent donc sans invite.
- name: Desktop — kitty maximisé sur ScreenPad Plus à l'ouverture de session
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: "{{ playbook_dir }}"
