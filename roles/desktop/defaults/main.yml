---
# Choix de l'opérateur (BUR-0 → ce livrable) : kitty — rendu GPU, volets
# et onglets natifs, scriptable. Un seul paquet demandé explicitement ;
# ses dépendances (kitty-kitten, kitty-shell-integration, kitty-terminfo)
# et la dépendance faible ripgrep sont résolues par dnf, pas listées ici
# — toutes depuis fedora/updates, jamais terra ni un autre dépôt.
desktop_kitty_package: kitty

# Fait propre à cette machine (D1/D4, point 6 de la demande) : nom du
# connecteur DRM du ScreenPad Plus, établi par lecture directe
# (kscreen-doctor -o, docs/desktop.md BUR-0) — jamais un index ou une
# valeur devinée. Exposé en variable, pas en dur dans tasks/main.yml,
# précisément pour qu'une machine reconstruite avec un nommage de
# connecteur différent fasse échouer la mesure (tasks/main.yml,
# failed_when sur stdout vide) plutôt que de placer silencieusement la
# règle sur une géométrie jamais vérifiée.
desktop_target_output: DP-3

desktop_config_home: "{{ ansible_facts.env.HOME }}/.config"
desktop_kitty_config_dir: "{{ desktop_config_home }}/kitty"
desktop_kwinrulesrc_path: "{{ desktop_config_home }}/kwinrulesrc"
desktop_autostart_dir: "{{ desktop_config_home }}/autostart"
desktop_autostart_desktop_file: "{{ desktop_autostart_dir }}/kitty-screenpad.desktop"

# Critère de correspondance de la règle KWin (§ 2 de la demande) : app_id
# Wayland réel de kitty, relevé par introspection D-Bus
# (org.kde.KWin.getWindowInfo, champ "resourceClass") sur une fenêtre
# kitty réellement en cours d'exécution le 2026-08-06 — pas déduit du nom
# du paquet ni du binaire. Confirmé par la documentation propre de kitty
# (`kitty --help` : "--class, --app-id=[kitty] ... On Wayland set the
# application id", valeur par défaut déjà "kitty"). Champ exact dans
# kwinrulesrc : `wmclass` (String), avec `wmclassmatch` (Int, schéma
# source KWin v6.7.3 — 0=UnimportantMatch, 1=ExactMatch, 2=SubstringMatch,
# 3=RegExpMatch) — voir docs/desktop.md § 2.
desktop_kitty_wmclass: kitty
desktop_kitty_wmclassmatch: 1  # ExactMatch

# Identifiant de règle KWin — clé stable choisie par ce rôle (pas un id
# généré par l'interface graphique), pour que le rôle sache reconnaître
# et ré-écrire sa propre règle de façon idempotente.
desktop_kwin_rule_id: desktop-kitty-screenpad

# --- Mécanisme de placement : position+size (Apply initially), pas
# screen+maximize — voir la politique de règle retenue plus bas
# (desktop_kitty_placerule) ; ce titre a divergé du code une première
# fois (annonçait « Force » alors que le code portait déjà la valeur 3,
# Apply — corrigé le 2026-08-06, CLAUDE.md § un commentaire qui énonce
# une décision se relit à chaque révision de cette décision).
# -----------------------------------------------------------------------
# ÉTAIT (première version de ce rôle, § 3 de la demande) : placement par
# index d'écran (`screen`, `screenrule=Force`) combiné à la maximisation
# booléenne (`maximizehoriz`/`maximizevert`). **Testé de façon répétée
# et rigoureuse le 2026-08-06 (méthode complète : docs/desktop.md § 3),
# et abandonné** : la propriété `screen` — même en `Force`, même
# combinée à `placement=PlacementMaximizing` en `Force` — ne détermine
# PAS de façon fiable l'écran de destination sur cette version de KWin
# (6.7.3). Le placement observé suit `org.kde.KWin.activeOutputName`
# (la sortie « active », déterminée par le focus/l'interaction en
# cours), pas la valeur numérique de la règle — démontré en observant le
# même index (0 ou 1) produire tantôt eDP-1, tantôt DP-3, en corrélation
# stricte avec activeOutputName relevé juste avant chaque essai, jamais
# avec l'index configuré.
#
# Mécanisme retenu, testé fiable à travers plusieurs essais y compris
# avec activeOutputName délibérément différent de la cible : `position`
# (Point) + `size` (Size), réglées sur la géométrie logique **réellement
# mesurée** de DP-3 au moment de l'exécution du rôle (`kscreen-doctor
# -o`, jamais une valeur figée en dur) — ce mécanisme contourne
# l'algorithme de placement plutôt que de tenter de l'influencer. Les
# clés effectives (`position`, `size` et leurs valeurs) sont construites
# dans tasks/main.yml à partir de la mesure en direct, pas ici en dur —
# il n'y a donc pas de "valeur par défaut propre à cette machine" à
# figer pour ces deux clés spécifiquement : la mesure fait foi à chaque
# exécution, exactement l'esprit demandé au § 6, mais par une mesure
# systématique plutôt que par une valeur par défaut assertée.
#
# Politique de règle (`positionrule`/`sizerule`) : `Apply initially`
# (3), pas `Force` (2) — les deux ont été mesurées fiables à la création
# de la fenêtre (géométrie identique, 0,1067 2560x734, dans les deux
# cas, testé le 2026-08-06). Le choix se fait donc sur autre chose que
# la fiabilité : les libellés et descriptions exacts de l'interface KWin
# elle-même (source externe, `src/kcms/rules/optionsmodel.cpp`, tag
# v6.7.3) sont sans ambiguïté — `Force` : "The window property will be
# always forced to the given value." ; `Apply initially` : "The window
# property will be only set to the given value after the window is
# created. No further changes will be affected." `wmclass=kitty` en
# `ExactMatch` matche GÉNÉRIQUEMENT toute fenêtre kitty, pas seulement
# celle de démarrage — `Force` aurait donc empêché l'opérateur de
# déplacer ou redimensionner N'IMPORTE QUELLE fenêtre kitty, y compris
# celles ouvertes manuellement plus tard pour un autre usage. `Apply
# initially` positionne chaque nouvelle fenêtre kitty sur DP-3 à sa
# création (l'effet demandé) sans jamais reprendre la main ensuite.
desktop_kitty_placerule: 3  # Apply initially (Rules::Apply)

# --- Écart assumé : « dimensionné », pas « maximisé » (consigné, pas corrigé)
# ---------------------------------------------------------------------------
# La demande initiale de l'opérateur (BUR-1) disait « maximisé » — un
# ÉTAT de fenêtre (maximizehoriz/maximizevert, un booléen que KWin gère
# lui-même, y compris ses éventuelles réservations de bord d'écran).
# Ce rôle produit autre chose : une fenêtre DIMENSIONNÉE aux pixels
# exacts de la sortie cible (position+size, ci-dessus), pas mise dans
# l'état « maximisé ». Choix assumé, pas un oubli : le mécanisme d'état
# (maximizehoriz/maximizevert) dépendait, dans la première version de
# ce rôle, du même index d'écran (screen/screenrule) établi inopérant
# ci-dessus — position+size est la voie qui s'est vérifiée fonctionner,
# l'état de maximisation n'a pas été retesté séparément une fois le
# pivot fait. Sans conséquence aujourd'hui : aucun panneau Plasma
# n'occupe DP-3 (vérifié, docs/desktop.md § 6). Symptôme à surveiller
# si ça change : une fenêtre dimensionnée aux pixels de la sortie ne
# respecte pas une réservation de bord d'écran ultérieure (panneau
# Plasma ajouté sur DP-3) — elle passerait dessous ou dessus au lieu de
# s'ajuster, contrairement à une fenêtre réellement à l'état maximisé.
# Aucune correction entreprise ici (docs/desktop.md § 6.10).

# --- Disposition de démarrage (BUR-2, 2026-08-09) : claude | htop / shell
# ---------------------------------------------------------------------------
# Fichier de session kitty (kitty/session.py, format sourcé dans le code
# amont — docs/desktop.md § 1.1), déployé plutôt qu'écrit à la main.
# Chemin résolu relatif au répertoire de config kitty, jamais absolu
# dans le fichier .desktop (point 3 de la demande — kitty résout les
# chemins relatifs de --session par rapport à son propre répertoire de
# configuration, kitty.1 § --session, pas par rapport au CWD du
# lanceur).
desktop_kitty_session_file: startup.session
desktop_kitty_session_path: "{{ desktop_kitty_config_dir }}/{{ desktop_kitty_session_file }}"

# Répertoire de travail des trois volets — variable, jamais un chemin
# propre à cette machine en dur ; valeur par défaut dérivée du
# répertoire personnel (point 3 de la demande), pas un sous-répertoire
# de projet particulier.
desktop_kitty_session_cwd: "{{ ansible_facts.env.HOME }}"

# Commandes lancées dans chaque volet — noms simples résolus par PATH à
# l'exécution de kitty (comme kitty.conf.5 le documente pour les
# commandes de session), pas un chemin figé ici. Chacune est gardée par
# une vérification command -v avant déploiement (tasks/main.yml) :
# échec bruyant si absente, plutôt qu'un volet qui se ferme
# silencieusement au démarrage sans aucun message (le mode d'échec
# typique de kitty pour une commande introuvable).
desktop_kitty_claude_cmd: claude
desktop_kitty_htop_cmd: htop
desktop_kitty_shell_cmd: bash

# Répartition gauche/droite (séparation verticale, claude | htop+shell)
# — kitty/launch.py --bias : la NOUVELLE fenêtre (htop) prend ce
# pourcentage de l'espace de la fenêtre existante (claude) qu'elle
# scinde. 50 : moitié-moitié, aucune contrainte particulière relevée
# sur cet axe (la demande ne portait que sur la hauteur, § 2) —
# ajustable si besoin, même mécanisme que le biais vertical ci-dessous.
desktop_kitty_vsplit_bias: 50

# Répartition haut/bas dans la colonne de droite (htop en haut,
# l'interpréteur en bas) — MESURÉE, pas devinée (§ 2 de la demande).
# À bias=50 (moitié-moitié, DP-3 mesuré 2560x734 logiques, police
# Noto Sans Mono 12.0) : htop reçoit 16 lignes sur 137 colonnes — son
# en-tête (grille CPU 8×4 pour 32 threads + Mem + Swp/Load/Uptime + une
# ligne vide + la barre d'onglets + l'en-tête de colonnes, mesuré par
# `kitten @ get-text`, docs/desktop.md § 2) occupe à lui seul 10-11
# lignes, ne laissant que 4 lignes de processus visibles — trop juste
# pour un usage réel. À bias=30, htop reçoit 23 lignes (12 processus
# visibles, mesuré de la même façon), l'interpréteur en bas en reçoit 9
# — suffisant pour une invite de commande. Valeur par défaut retenue
# pour cette raison, ajustable : l'opérateur a le chiffre, pas une
# décision prise à sa place (§ 2 de la demande, « donne-lui le
# chiffre »).
desktop_kitty_htop_bias: 30
