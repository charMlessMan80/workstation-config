---
# Rôle desktop — installe et configure kitty (choix de l'opérateur,
# BUR-0), le place maximisé sur le ScreenPad Plus (DP-3) à l'ouverture de
# session via une règle KWin écrite par clé nommée (jamais une copie
# brute d'un fichier de configuration Plasma — voir docs/desktop.md § 5
# sur le mélange réglages/état trouvé dans kwinrc). Ce rôle ne touche
# jamais kwinrc, sudoers, /etc/cdi/, gpu_mux_mode, dgpu_disable ; ne
# change jamais de mode d'affichage ni d'échelle ; ne redémarre jamais et
# ne déconnecte jamais la session.
#
# Mécanisme de placement : position+size mesurés en direct, pas un index
# d'écran figé — voir le motif complet dans defaults/main.yml
# (`screen`/`screenrule=Force` testé et abandonné, confondu avec
# `activeOutputName`) et docs/desktop.md § 3.

# --- Installation (seules actions privilégiées du rôle : kitty et jq,
# BUR-4) ---------------------------------------------------------------

- name: "Installer kitty (dépôts fedora/updates uniquement, aucun autre paquet demandé)"
  ansible.builtin.dnf:
    name: "{{ desktop_kitty_package }}"
    state: present
  become: true
  register: desktop_kitty_install
  when: not ansible_check_mode

- name: >-
    Installer jq (BUR-4, dépôts fedora/updates — nécessaire au script de
    temporisation pour lire kscreen-doctor -j, § 9 de docs/desktop.md)
  ansible.builtin.dnf:
    name: "{{ desktop_jq_package }}"
    state: present
  become: true
  register: desktop_jq_install
  when: not ansible_check_mode

# --- Configuration kitty : fichier sobre, versionné, déployé tel quel -----

- name: "S'assurer que le répertoire de configuration existe : {{ desktop_kitty_config_dir }}"
  ansible.builtin.file:
    path: "{{ desktop_kitty_config_dir }}"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

- name: "Déployer kitty.conf (sobre : police, taille, défilement arrière — rien de plus)"
  ansible.builtin.copy:
    src: kitty.conf
    dest: "{{ desktop_kitty_config_dir }}/kitty.conf"
    mode: "0644"
  when: not ansible_check_mode

# --- Géométrie de DP-3, mesurée en direct — jamais figée en dur ----------
# Motif du placement de ce bloc, avant l'écriture de la règle (pas
# seulement après, pour vérification) : le mécanisme retenu (position +
# size, § defaults/main.yml) a besoin de cette mesure pour construire la
# règle elle-même, pas seulement pour la vérifier après coup.

- name: "Relever la géométrie logique actuelle de la sortie cible (ScreenPad Plus) : {{ desktop_target_output }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail
      && kscreen-doctor -o | sed 's/\x1b\[[0-9;]*m//g' | awk -v target="{{ desktop_target_output }}" '
        /^Output:/ { name=$3 }
        /Geometry:/ && name==target { print $2, $3; exit }
      '
    executable: /bin/bash
  register: desktop_dp3_geometry_raw
  changed_when: false
  check_mode: false
  # Échec bruyant, pas silencieux (point 6 de la demande) : si
  # desktop_target_output ne correspond à aucune sortie connue de
  # kscreen-doctor (nom de connecteur différent sur une machine
  # reconstruite, sortie débranchée), stdout reste vide et cette
  # tâche échoue plutôt que d'écrire une règle sur une géométrie
  # jamais mesurée.
  failed_when: desktop_dp3_geometry_raw.stdout | trim | length == 0

- name: "Décomposer la géométrie de DP-3 (x, y, largeur, hauteur logiques)"
  ansible.builtin.set_fact:
    desktop_dp3_x: "{{ (desktop_dp3_geometry_raw.stdout | trim).split(' ')[0].split(',')[0] | int }}"
    desktop_dp3_y: "{{ (desktop_dp3_geometry_raw.stdout | trim).split(' ')[0].split(',')[1] | int }}"
    desktop_dp3_w: "{{ (desktop_dp3_geometry_raw.stdout | trim).split(' ')[1].split('x')[0] | int }}"
    desktop_dp3_h: "{{ (desktop_dp3_geometry_raw.stdout | trim).split(' ')[1].split('x')[1] | int }}"
  check_mode: false

- name: "Construire la liste des clés de la règle KWin à partir de la mesure"
  ansible.builtin.set_fact:
    desktop_kwin_rule_keys:
      - {key: Description, value: "kitty placé sur ScreenPad Plus (DP-3) — géré par roles/desktop/", type: string}
      - {key: wmclass, value: "{{ desktop_kitty_wmclass }}", type: string}
      - {key: wmclassmatch, value: "{{ desktop_kitty_wmclassmatch }}", type: int}
      - {key: position, value: "{{ desktop_dp3_x }},{{ desktop_dp3_y }}", type: point}
      - {key: positionrule, value: "{{ desktop_kitty_placerule }}", type: int}
      - {key: size, value: "{{ desktop_dp3_w }},{{ desktop_dp3_h }}", type: size}
      - {key: sizerule, value: "{{ desktop_kitty_placerule }}", type: int}
  check_mode: false

# --- Règle KWin : écriture par clé nommée, jamais une copie de fichier ----
# Motif du chemin retenu (kwinrulesrc, pas kwinrc) : kwinrulesrc porte les
# règles de fenêtre, un espace de noms distinct de kwinrc (réglages
# généraux) — docs/desktop.md § 5 documente kwinrc mélangeant réglages et
# état de session (UUID de bureau/sortie), jamais touché ici.
# Chaque clé est relue avant d'être écrite : kwriteconfig6 ne rapporte
# jamais lui-même s'il a changé quelque chose, donc l'idempotence de ce
# rôle dépend de cette lecture préalable, pas de la commande d'écriture.

- name: "Relever la liste actuelle des règles dans kwinrulesrc"
  ansible.builtin.command:
    cmd: "kreadconfig6 --file {{ desktop_kwinrulesrc_path }} --group General --key rules"
  register: desktop_kwin_rules_current
  changed_when: false
  check_mode: false

- name: "Ajouter l'identifiant de règle de ce rôle à la liste, s'il n'y est pas déjà"
  # Forme liste (argv), pas une chaîne shell-splittée : une valeur
  # contenant un espace ou une ponctuation ne doit jamais être coupée en
  # plusieurs arguments — défaut réel trouvé et corrigé sur la tâche
  # suivante (§ Description), appliqué ici par cohérence préventive.
  ansible.builtin.command:
    argv:
      - kwriteconfig6
      - --file
      - "{{ desktop_kwinrulesrc_path }}"
      - --group
      - General
      - --key
      - rules
      - >-
          {{ ((desktop_kwin_rules_current.stdout | trim).split(',')
             | select('string') | reject('equalto', '') | list
             + [desktop_kwin_rule_id]) | unique | join(',') }}
  when:
    - not ansible_check_mode
    - desktop_kwin_rule_id not in (desktop_kwin_rules_current.stdout | trim).split(',')
  # Cette commande, quand elle s'exécute (le "when" ci-dessus l'a déjà
  # limitée au cas où la liste change réellement), modifie toujours
  # kwinrulesrc — déclaré explicitement plutôt que laissé au
  # comportement par défaut du module command.
  changed_when: true
  register: desktop_kwin_rules_write
  notify: Reconfigure KWin

- name: "Relever la valeur actuelle de chaque clé de la règle KWin de ce rôle"
  ansible.builtin.command:
    cmd: "kreadconfig6 --file {{ desktop_kwinrulesrc_path }} --group {{ desktop_kwin_rule_id }} --key {{ item.key }}"
  loop: "{{ desktop_kwin_rule_keys }}"
  loop_control:
    label: "{{ item.key }}"
  register: desktop_kwin_rule_current
  changed_when: false
  check_mode: false

- name: "Écrire les clés de la règle KWin qui diffèrent de la valeur attendue"
  # Forme liste (argv) — défaut réel trouvé lors des tests de ce
  # livrable : la forme "cmd" en chaîne unique, découpée façon shell,
  # coupait "Description" au premier espace — seul "kitty" était écrit.
  ansible.builtin.command:
    argv: >-
      {{
        ['kwriteconfig6', '--file', desktop_kwinrulesrc_path,
         '--group', desktop_kwin_rule_id, '--key', item.item.key]
        + (['--type', item.item.type] if item.item.type != 'string' else [])
        + [item.item.value | string]
      }}
  loop: "{{ desktop_kwin_rule_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - not ansible_check_mode
    - (item.stdout | trim) != (item.item.value | string)
  # Idem : ne s'exécute (via le "when" ci-dessus) que lorsque la valeur
  # diffère réellement — donc modifie toujours kwinrulesrc quand elle
  # tourne. Déclaré explicitement, pas laissé au défaut du module.
  changed_when: true
  register: desktop_kwin_rule_write
  notify: Reconfigure KWin

- name: "Appliquer immédiatement le rechargement de configuration KWin, si notifié (sans redémarrer la session)"
  ansible.builtin.meta: flush_handlers

# --- Vérification par la mesure : ferme ou requalifie le marqueur ouvert
# au § 1.3 de docs/desktop.md (correspondance ordre DRM / liste interne
# de KWin, laissée ouverte par BUR-0). Ne fait jamais confiance à la
# règle écrite sans la vérifier contre la géométrie réelle d'une
# fenêtre de test, mesurée en direct — pas une valeur supposée stable.

- name: >-
    Lancer une fenêtre kitty de test (PID isolé, jamais pkill sur les
    fenêtres de l'opérateur) et relever sa géométrie réelle par
    introspection D-Bus de KWin (org.kde.KWin.getWindowInfo)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      kitty >/dev/null 2>&1 &
      TEST_PID=$!
      UUID=""
      for i in $(seq 1 20); do
        sleep 0.25
        MATCHES=$(busctl --user call org.kde.KWin /WindowsRunner org.kde.krunner1 Match s "kitty" 2>/dev/null || true)
        for candidate in $(echo "$MATCHES" | grep -oE '\{[0-9a-f-]+\}' || true); do
          INFO=$(busctl --user call org.kde.KWin /KWin org.kde.KWin getWindowInfo s "$candidate" 2>/dev/null || true)
          if echo "$INFO" | grep -q "\"pid\" i $TEST_PID "; then
            UUID="$candidate"
            break 2
          fi
        done
      done
      if [ -z "$UUID" ]; then
        kill "$TEST_PID" 2>/dev/null || true
        echo "ÉCHEC : fenêtre de test kitty (pid=$TEST_PID) introuvable par introspection D-Bus après 5s" >&2
        exit 1
      fi
      busctl --user call org.kde.KWin /KWin org.kde.KWin getWindowInfo s "$UUID"
      kill "$TEST_PID" 2>/dev/null || true
  register: desktop_verify_window_info
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: "Extraire x/y/largeur/hauteur mesurés de la fenêtre de test"
  ansible.builtin.set_fact:
    desktop_measured_x: "{{ desktop_verify_window_info.stdout | regex_search('\"x\" d ([0-9.]+)', '\\1') | first | float }}"
    desktop_measured_y: "{{ desktop_verify_window_info.stdout | regex_search('\"y\" d ([0-9.]+)', '\\1') | first | float }}"
    desktop_measured_w: "{{ desktop_verify_window_info.stdout | regex_search('\"width\" d ([0-9.]+)', '\\1') | first | float }}"
    desktop_measured_h: "{{ desktop_verify_window_info.stdout | regex_search('\"height\" d ([0-9.]+)', '\\1') | first | float }}"
  when: not ansible_check_mode

- name: >-
    Échouer bruyamment si la fenêtre de test ne s'est pas ouverte sur
    DP-3 — ferme ou requalifie le marqueur ouvert au § 1.3 de
    docs/desktop.md, par la mesure, pas par supposition. Tolérance de
    5 px pour les arrondis déjà observés.
  ansible.builtin.assert:
    that:
      - (desktop_measured_x | float - desktop_dp3_x | float) | abs < 5
      - (desktop_measured_y | float - desktop_dp3_y | float) | abs < 5
      - (desktop_measured_w | float - desktop_dp3_w | float) | abs < 5
      - (desktop_measured_h | float - desktop_dp3_h | float) | abs < 5
    fail_msg: >-
      La règle KWin place la fenêtre de test à x={{ desktop_measured_x }},
      y={{ desktop_measured_y }}, {{ desktop_measured_w }}x{{ desktop_measured_h }}
      — attendu (DP-3, mesuré) : x={{ desktop_dp3_x }}, y={{ desktop_dp3_y }},
      {{ desktop_dp3_w }}x{{ desktop_dp3_h }}. La règle position+size
      n'a pas produit l'effet attendu sur cette exécution — ne pas
      déployer l'autostart sur cette base (les tâches suivantes ne
      s'exécuteront pas, ce play s'arrête ici). Revoir
      docs/desktop.md § 3 avant de relancer.
    success_msg: >-
      Fenêtre de test mesurée sur DP-3 (x={{ desktop_measured_x }},
      y={{ desktop_measured_y }}, {{ desktop_measured_w }}x{{ desktop_measured_h }})
      — règle position+size confirmée efficace par la mesure, pas
      supposée.
  when: not ansible_check_mode

# --- Disposition de démarrage (BUR-2) : garde d'existence, déploiement,
# vérification par la mesure — jamais par confiance, même patron que la
# règle KWin ci-dessus.

- name: "Garde § 3 — vérifier que chaque commande de la session de démarrage existe sur le PATH"
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "command -v {{ item }}"
  loop:
    - "{{ desktop_kitty_claude_cmd }}"
    - "{{ desktop_kitty_htop_cmd }}"
    - "{{ desktop_kitty_shell_cmd }}"
  register: desktop_session_cmds_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Échouer bruyamment si une commande de la session de démarrage est absente du PATH"
  # Mode d'échec typique visé ici (point 3 de la demande) : un volet
  # dont la commande n'existe pas se ferme silencieusement au
  # démarrage, sans message — cette garde le rend bruyant avant même
  # que le fichier de session ne soit déployé.
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      La commande « {{ item.item }} » (volet de la session de démarrage
      kitty) est absente du PATH — un volet dont la commande n'existe
      pas se fermerait silencieusement au démarrage, sans message. Ce
      rôle s'arrête plutôt que de déployer une session qui échouerait
      en silence.
    success_msg: "Commande « {{ item.item }} » présente sur le PATH."
  loop: "{{ desktop_session_cmds_check.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "Déployer la session de démarrage kitty (nominale) : {{ desktop_kitty_session_path }}"
  ansible.builtin.template:
    src: kitty-startup.session.j2
    dest: "{{ desktop_kitty_session_path }}"
    mode: "0644"
  when: not ansible_check_mode

- name: >-
    Déployer la session de démarrage kitty (dégradée, BUR-4) :
    {{ desktop_kitty_session_degraded_path }}
  ansible.builtin.template:
    src: kitty-startup-degraded.session.j2
    dest: "{{ desktop_kitty_session_degraded_path }}"
    mode: "0644"
  when: not ansible_check_mode

# --- Script de temporisation (BUR-4) : condition de stabilité des
# sorties avant plein écran, délai maximal, repli dégradé annoncé —
# motif complet docs/desktop.md § 9.

- name: "S'assurer que le répertoire de scripts utilisateur existe : {{ desktop_local_bin_dir }}"
  ansible.builtin.file:
    path: "{{ desktop_local_bin_dir }}"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

- name: "Déployer le script de temporisation : {{ desktop_kitty_wait_script_path }}"
  ansible.builtin.template:
    src: kitty-startup-wait.sh.j2
    dest: "{{ desktop_kitty_wait_script_path }}"
    mode: "0755"
  when: not ansible_check_mode

# Vérification par la mesure, même patron que la règle KWin plus haut :
# lance une fenêtre de test AVEC la session réellement déployée ET le
# même --start-as=fullscreen que le script de temporisation applique en
# cas nominal (BUR-4 : le fichier de session lui-même ne porte plus
# l'état plein écran, § 9 de docs/desktop.md — cette combinaison est
# donc nécessaire pour vérifier la même chose qu'avant BUR-4) (contrôle
# distant activé pour ce seul lancement de test — jamais écrit dans
# kitty.conf), relève son état plein écran et sa géométrie par
# introspection D-Bus de KWin (comme ci-dessus), et sa structure
# interne (volets, disposition, commandes) par le mécanisme propre de
# kitty (kitten @ ls, docs/desktop.md § 4).

- name: >-
    Lancer une fenêtre kitty de test AVEC la session de démarrage
    réellement déployée (plus --start-as=fullscreen, appliqué par le
    script en cas nominal) et relever son état plein écran, sa
    géométrie (introspection D-Bus de KWin) et sa structure interne
    (kitten @ ls)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      SOCK_BASE="/tmp/desktop-verify-session-$$.sock"
      rm -f "$SOCK_BASE"*
      kitty -o allow_remote_control=yes -o "listen_on=unix:$SOCK_BASE" \
        --start-as=fullscreen --session "{{ desktop_kitty_session_path }}" >/dev/null 2>&1 &
      TEST_PID=$!
      # kitty ajoute toujours "-<pid>" au chemin de listen_on donné
      # (constaté à l'essai, docs/desktop.md § 4) — jamais le chemin nu.
      SOCK="${SOCK_BASE}-${TEST_PID}"
      UUID=""
      for i in $(seq 1 40); do
        sleep 0.25
        MATCHES=$(busctl --user call org.kde.KWin /WindowsRunner org.kde.krunner1 Match s "kitty" 2>/dev/null || true)
        for candidate in $(echo "$MATCHES" | grep -oE '\{[0-9a-f-]+\}' || true); do
          INFO=$(busctl --user call org.kde.KWin /KWin org.kde.KWin getWindowInfo s "$candidate" 2>/dev/null || true)
          if echo "$INFO" | grep -q "\"pid\" i $TEST_PID "; then
            UUID="$candidate"
            break 2
          fi
        done
      done
      if [ -z "$UUID" ]; then
        kill "$TEST_PID" 2>/dev/null || true
        echo "ÉCHEC : fenêtre de test kitty --session introuvable par introspection D-Bus après 10s" >&2
        exit 1
      fi
      for i in $(seq 1 20); do
        [ -S "$SOCK" ] && break
        sleep 0.25
      done
      # L'état plein écran (--start-as=fullscreen) n'est pas
      # nécessairement déjà rapporté par getWindowInfo au premier
      # instant où la fenêtre est trouvée par WindowsRunner — constaté
      # à l'essai (BUR-4) : la fenêtre existe avant que KWin ait fini
      # d'appliquer cet état. Revérifié jusqu'à 3 s avant de lire la
      # valeur finale, plutôt que de figer un délai fixe qui casserait
      # de la même façon qu'une temporisation fixe casserait le
      # problème que ce livrable résout par ailleurs (§ 1 de la
      # demande BUR-4).
      for i in $(seq 1 12); do
        INFO=$(busctl --user call org.kde.KWin /KWin org.kde.KWin getWindowInfo s "$UUID" 2>/dev/null || true)
        echo "$INFO" | grep -q '"fullscreen" b true' && break
        sleep 0.25
      done
      echo "===WINDOWINFO==="
      busctl --user call org.kde.KWin /KWin org.kde.KWin getWindowInfo s "$UUID"
      echo "===LS==="
      kitten @ --to "unix:$SOCK" ls
      kill "$TEST_PID" 2>/dev/null || true
      rm -f "$SOCK"
  register: desktop_verify_session_raw
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: "Séparer la géométrie/état (D-Bus) de la structure interne (kitten @ ls) dans la sortie de vérification"
  ansible.builtin.set_fact:
    desktop_verify_windowinfo: "{{ desktop_verify_session_raw.stdout.split('===LS===')[0] }}"
    desktop_verify_ls_json: "{{ (desktop_verify_session_raw.stdout.split('===LS===')[1]) | trim | from_json }}"
  when: not ansible_check_mode

- name: >-
    Échouer bruyamment si la session de test n'est pas plein écran sur
    DP-3, ou si sa structure (trois volets, disposition splits,
    commandes) ne correspond pas à ce qui a été déployé
  ansible.builtin.assert:
    that:
      - "'\"fullscreen\" b true' in desktop_verify_windowinfo"
      - (desktop_verify_windowinfo | regex_search('\"x\" d ([0-9.]+)', '\\1') | first | float - desktop_dp3_x | float) | abs < 5
      - (desktop_verify_windowinfo | regex_search('\"y\" d ([0-9.]+)', '\\1') | first | float - desktop_dp3_y | float) | abs < 5
      - (desktop_verify_windowinfo | regex_search('\"width\" d ([0-9.]+)', '\\1') | first | float - desktop_dp3_w | float) | abs < 5
      - (desktop_verify_windowinfo | regex_search('\"height\" d ([0-9.]+)', '\\1') | first | float - desktop_dp3_h | float) | abs < 5
      - desktop_verify_ls_json[0].tabs[0].layout == 'splits'
      - desktop_verify_ls_json[0].tabs[0].windows | length == 3
      - desktop_verify_ls_json[0].tabs[0].windows[0].title == 'claude'
      # kitty résout la commande en chemin absolu par PATH avant de la
      # rapporter (constaté à l'essai : "claude" -> "/usr/bin/claude")
      # — comparaison sur le nom de base, pas sur l'argv brut.
      - (desktop_verify_ls_json[0].tabs[0].windows[0].cmdline[0] | basename) == desktop_kitty_claude_cmd
      - desktop_verify_ls_json[0].tabs[0].windows[1].title == 'htop'
      - (desktop_verify_ls_json[0].tabs[0].windows[1].cmdline[0] | basename) == desktop_kitty_htop_cmd
      - desktop_verify_ls_json[0].tabs[0].windows[2].title == 'shell'
      - (desktop_verify_ls_json[0].tabs[0].windows[2].cmdline[0] | basename) == desktop_kitty_shell_cmd
    fail_msg: >-
      La session de test ne correspond pas à ce qui est attendu — soit
      elle n'est pas plein écran sur DP-3, soit sa structure interne
      diffère (voir desktop_verify_windowinfo et desktop_verify_ls_json
      dans les tâches précédentes pour le détail). Ce rôle s'arrête
      plutôt que de déployer l'autostart sur cette base.
    success_msg: >-
      Session de test confirmée plein écran sur DP-3, trois volets en
      disposition splits, commandes conformes — par la mesure, pas
      supposé.
  when: not ansible_check_mode

# --- Vérification du script de temporisation lui-même (BUR-4, § 4 de
# la demande) : en session déjà établie, la topologie est déjà stable —
# le script doit donc décider « nominal » quasi immédiatement. Lance le
# script réellement déployé (pas une commande reconstituée), PID isolé,
# mesure le temps écoulé jusqu'à sa propre décision (lu dans son propre
# journal stderr, pas recalculé côté Ansible) et confirme par
# introspection D-Bus que la fenêtre qui en résulte est bien plein
# écran sur DP-3 — la structure interne a déjà été confirmée ci-dessus
# avec la même combinaison de drapeaux.

- name: >-
    Lancer le script de temporisation réellement déployé (PID isolé) et
    relever son délai réel de décision (stderr) et l'état de la fenêtre
    qui en résulte (introspection D-Bus de KWin)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      "{{ desktop_kitty_wait_script_path }}" >/tmp/desktop-verify-wait-$$.out 2>/tmp/desktop-verify-wait-$$.err &
      TEST_PID=$!
      UUID=""
      for i in $(seq 1 40); do
        sleep 0.25
        MATCHES=$(busctl --user call org.kde.KWin /WindowsRunner org.kde.krunner1 Match s "kitty" 2>/dev/null || true)
        for candidate in $(echo "$MATCHES" | grep -oE '\{[0-9a-f-]+\}' || true); do
          INFO=$(busctl --user call org.kde.KWin /KWin org.kde.KWin getWindowInfo s "$candidate" 2>/dev/null || true)
          if echo "$INFO" | grep -q "\"pid\" i $TEST_PID "; then
            UUID="$candidate"
            break 2
          fi
        done
      done
      if [ -z "$UUID" ]; then
        kill "$TEST_PID" 2>/dev/null || true
        echo "ÉCHEC : fenêtre issue du script de temporisation introuvable par introspection D-Bus après 10s" >&2
        cat "/tmp/desktop-verify-wait-$$.err" >&2 || true
        exit 1
      fi
      # Même stabilisation que la vérification de session ci-dessus :
      # l'état plein écran n'est pas nécessairement déjà rapporté au
      # premier instant où la fenêtre est trouvée.
      for i in $(seq 1 12); do
        INFO=$(busctl --user call org.kde.KWin /KWin org.kde.KWin getWindowInfo s "$UUID" 2>/dev/null || true)
        echo "$INFO" | grep -q '"fullscreen" b true' && break
        sleep 0.25
      done
      echo "===WINDOWINFO==="
      busctl --user call org.kde.KWin /KWin org.kde.KWin getWindowInfo s "$UUID"
      echo "===LOG==="
      cat "/tmp/desktop-verify-wait-$$.err"
      kill "$TEST_PID" 2>/dev/null || true
      rm -f "/tmp/desktop-verify-wait-$$.out" "/tmp/desktop-verify-wait-$$.err"
  register: desktop_verify_wait_raw
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: "Séparer la géométrie/état (D-Bus) du journal du script dans la sortie de vérification"
  ansible.builtin.set_fact:
    desktop_verify_wait_windowinfo: "{{ desktop_verify_wait_raw.stdout.split('===LOG===')[0] }}"
    desktop_verify_wait_log: "{{ desktop_verify_wait_raw.stdout.split('===LOG===')[1] }}"
    # Dernière valeur "t=…ms" du journal du script — son propre relevé,
    # pas un chronométrage recalculé côté Ansible (qui inclurait la
    # latence de l'introspection D-Bus, sans rapport avec la question
    # posée : le temps que LE SCRIPT a mis à décider).
    desktop_verify_wait_elapsed_ms: >-
      {{ (desktop_verify_wait_raw.stdout.split('===LOG===')[1]
          | regex_findall('t=([0-9]+)ms') | last) | int }}
  when: not ansible_check_mode

- name: >-
    Échouer bruyamment si le script de temporisation n'a pas décidé
    « nominal » quasi immédiatement en session déjà établie, ou si la
    fenêtre qui en résulte n'est pas plein écran sur DP-3
  ansible.builtin.assert:
    that:
      - "'\"fullscreen\" b true' in desktop_verify_wait_windowinfo"
      - (desktop_verify_wait_windowinfo | regex_search('\"x\" d ([0-9.]+)', '\\1') | first | float - desktop_dp3_x | float) | abs < 5
      - (desktop_verify_wait_windowinfo | regex_search('\"y\" d ([0-9.]+)', '\\1') | first | float - desktop_dp3_y | float) | abs < 5
      - "'lancement nominal' in desktop_verify_wait_log"
      # Proche de zéro, pas littéralement zéro : au moins un intervalle
      # d'échantillonnage sépare deux lectures consécutives par
      # construction (desktop_kitty_wait_stable_samples ≥ 2) — borne
      # lâche ici (la moitié du délai maximal) pour distinguer un délai
      # normal d'un délai qui a dérivé vers le cas dégradé sans échouer
      # au test ci-dessus par ailleurs.
      - desktop_verify_wait_elapsed_ms | int < ((desktop_kitty_wait_max_seconds | float * 1000 / 2) | int)
    fail_msg: >-
      Le script de temporisation n'a pas décidé « nominal » comme
      attendu en session déjà établie (délai relevé :
      {{ desktop_verify_wait_elapsed_ms }} ms, borné à
      {{ desktop_kitty_wait_max_seconds }} s) — voir
      desktop_verify_wait_log et desktop_verify_wait_windowinfo pour le
      détail. Ce rôle s'arrête plutôt que de déployer l'autostart sur
      cette base.
    success_msg: >-
      Script de temporisation confirmé : décision « nominal » en
      {{ desktop_verify_wait_elapsed_ms }} ms (session déjà établie),
      fenêtre résultante plein écran sur DP-3 — par la mesure, pas
      supposé.
  when: not ansible_check_mode

# --- Autostart : fichier .desktop généré, sans chemin propre à cette machine

- name: "S'assurer que le répertoire autostart existe : {{ desktop_autostart_dir }}"
  ansible.builtin.file:
    path: "{{ desktop_autostart_dir }}"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

- name: >-
    Déployer l'entrée autostart (Exec=le script de temporisation,
    résolu par PATH — aucun chemin absolu propre à cette machine)
  ansible.builtin.template:
    src: kitty-screenpad.desktop.j2
    dest: "{{ desktop_autostart_desktop_file }}"
    mode: "0644"
  when: not ansible_check_mode

# --- Rapport -----------------------------------------------------------

- name: "Rapporter l'état (mode simulation --check)"
  ansible.builtin.debug:
    msg: >-
      --check : aucune écriture réalisée. kitty et jq seraient
      installés, la règle KWin ({{ desktop_kwin_rule_id }}) écrite avec
      la géométrie de DP-3 mesurée à cet instant, les sessions de
      démarrage (nominale et dégradée) déployées dans
      {{ desktop_kitty_config_dir }}, le script de temporisation dans
      {{ desktop_kitty_wait_script_path }}, l'autostart déployé dans
      {{ desktop_autostart_desktop_file }}.
  when: ansible_check_mode

- name: "Rapporter l'état (exécution réelle)"
  ansible.builtin.debug:
    msg:
      - "kitty et jq installés, configuration sobre déployée dans {{ desktop_kitty_config_dir }}/kitty.conf."
      - "Règle KWin {{ desktop_kwin_rule_id }} écrite par clé nommée dans {{ desktop_kwinrulesrc_path }} — kwinrc jamais touché."
      - "Géométrie DP-3 confirmée par la mesure : {{ desktop_dp3_x }},{{ desktop_dp3_y }} {{ desktop_dp3_w }}x{{ desktop_dp3_h }}."
      - >-
          Sessions de démarrage déployées : nominale
          ({{ desktop_kitty_session_path }}, claude | htop
          ({{ desktop_kitty_htop_bias }}% pour l'interpréteur), plein
          écran appliqué par le script — pas par ce fichier) et dégradée
          ({{ desktop_kitty_session_degraded_path }}, mêmes volets, sans
          plein écran, avertissement imprimé dans le volet shell) —
          confirmées par une fenêtre de test (trois volets, disposition
          splits).
      - >-
          Script de temporisation déployé dans
          {{ desktop_kitty_wait_script_path }} — attend
          {{ desktop_kitty_wait_stable_samples }} échantillons
          consécutifs identiques de kscreen-doctor -j (intervalle
          {{ desktop_kitty_wait_interval_seconds }} s), borné à
          {{ desktop_kitty_wait_max_seconds }} s ; décision « nominal »
          confirmée en {{ desktop_verify_wait_elapsed_ms | default('n/d') }} ms
          dans cette session déjà établie.
      - >-
          Autostart déployé dans {{ desktop_autostart_desktop_file }}
          (Exec={{ desktop_kitty_wait_script_file }}) —
          effectif à la prochaine ouverture de session, pas vérifié ici.
  when: not ansible_check_mode
