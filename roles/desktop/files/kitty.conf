# kitty.conf — configuration sobre, déployée par roles/desktop/.
# Chaque option porte son motif ; rien n'est posé "par défaut recommandé
# sur Internet". Pas de thème, pas de raccourci exotique, pas d'option
# esthétique — l'opérateur ajustera lui-même au besoin.

# Police à chasse fixe déjà en usage comme défaut système sur ce poste
# (fc-match monospace, docs/desktop.md § BUR-0) — cohérence avec le reste
# du bureau, aucune nouvelle dépendance de police introduite par ce rôle.
font_family      Noto Sans Mono

# Taille explicite plutôt que le défaut de l'outil (qui pourrait changer
# entre versions de kitty sans que ce dépôt le sache) — valeur choisie,
# puis mesurée en colonnes/lignes réelles sur DP-3 (docs/desktop.md § 1),
# pas seulement calculée.
font_size        12.0

# Défilement arrière explicite, pas le défaut implicite de l'outil
# (2000, kitty documentation officielle). Relevé plus haut qu'un usage
# généraliste pour un usage CLI intensif (logs de build/test longs) —
# coût mémoire négligeable (alloué à la demande, documentation kitty),
# volontairement pas illimité pour ne pas dégrader les performances
# (mise en garde de la documentation officielle elle-même).
scrollback_lines 10000
