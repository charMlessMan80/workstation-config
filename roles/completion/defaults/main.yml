---
# Décisions de l'opérateur (docs/machine-facts.md § Décisions — numéros
# vérifiés libres avant attribution, CMP-1) :
#   D19 — complétion locale par lsp-ai, compilé depuis les sources
#         (crates.io, quatrième surface d'approvisionnement de ce
#         dépôt) — jamais le binaire précompilé (aucune somme de
#         contrôle publiée, ancrage de confiance plus faible que npm).
#   D20 — modèle de complétion à la demande, pas résident (requalifiait
#         D15 à cette date) — ce rôle ne charge ni ne choisit aucun
#         modèle, fait inchangé par le réalignement suivant.
#         [RÉALIGNÉE le 2026-08-12, BSH-2, roles/local_ai/] — D15 est
#         revenue à la résidence permanente (`docs/machine-facts.md`
#         § Décisions, coût réel mesuré à 100 % de blocage RTD3 une
#         fois le modèle chargé, pas les ~25 % d'une fenêtre mêlant
#         pré-chargement et résidence). Sans effet sur CE rôle, qui n'a
#         jamais chargé de modèle lui-même dans un cas comme dans
#         l'autre — les autres mentions de D20 dans ce rôle
#         (`tasks/main.yml`, `meta/main.yml`, `templates/*.j2`,
#         `completion.yml`) décrivent ce même fait inchangé, restent
#         exactes telles quelles, non modifiées par BSH-3.
#   D21 — modèle de complétion retenu : qwen2.5-coder:7b-instruct-q4_K_M
#         (IA-3, docs/machine-facts.md § Décisions) — récupéré par
#         roles/local_ai/, jamais téléchargé par ce rôle.
#   D22 — chargement séquentiel (IA-4) : conséquence pour ce rôle,
#         aucune — la bascule est gérée par Ollama lui-même (le
#         serveur décharge/recharge selon la demande), ce rôle ne fait
#         que pointer le bon nom de modèle et vérifier qu'il existe.

# --- D19 : dépôt amont, épinglé par empreinte de commit, pas une étiquette ---
# Étiquette la plus récente au moment de la résolution (docs/completion.md
# § 2.1) : v0.7.1 (2024-09-24) — mais HEAD de `main` a avancé depuis
# (dernier commit vérifié : 2025-01-07, `git ls-remote`/API GitHub).
# Épinglé par empreinte de commit, jamais par étiquette (une étiquette
# peut être déplacée, un commit non — même motif que
# local_ai_ollama_image_digest dans roles/local_ai/).
completion_lsp_ai_repo: https://github.com/SilasMarvin/lsp-ai.git
completion_lsp_ai_commit: 1e910a8cf0048406eb227bf2064743010a9ff3a9

# Répertoire de travail HORS de ce dépôt git (demande § 2.2) — sous le
# cache utilisateur, jamais versionné (D4 : code source tiers, pas une
# recette). Réutilisé d'une exécution à l'autre (le module git est
# idempotent sur `version:` déjà atteinte) plutôt que recréé à chaque
# fois, pour ne pas retélécharger l'historique à chaque exécution.
completion_build_dir: "{{ ansible_facts.env.HOME }}/.cache/completion-build/lsp-ai"

# Domaine utilisateur uniquement (interdits de la demande) — jamais
# /usr/local/, jamais un chemin système.
completion_bin_dir: "{{ ansible_facts.env.HOME }}/.local/bin"
completion_bin_name: lsp-ai

# --- Chaîne de compilation --------------------------------------------
# Seule installation système autorisée par la demande (« la chaîne de
# compilation qui vient des dépôts ») — fedora/updates uniquement,
# jamais terra (vérifié par lecture avant d'écrire ce rôle,
# docs/completion.md § 1 : `dnf repoquery --available --qf '%{repoid}'
# rust cargo` ne montre que fedora/updates).
completion_rust_packages:
  - rust
  - cargo

# Garde a posteriori (post-installation) : la chaîne est bien
# fonctionnelle. Substituable pour la démonstration d'échec forcé sans
# jamais désinstaller quoi que ce soit réellement :
# -e completion_rust_check_binaries=['cargo_absent_garanti']
completion_rust_check_binaries:
  - cargo
  - rustc

# --- Correction d'un décalage préexistant dans Cargo.lock amont --------
# Découverte en écrivant ce rôle (docs/completion.md § 1.1, signalée à
# l'opérateur avant d'être appliquée, § 0 de la demande CMP-1) :
# `cargo build --release --locked` échoue tel quel sur ce Cargo.lock —
# hf-hub est une dépendance git déclarée par version seule ("0.3.2"),
# sans rev fixe ; le dépôt hf-hub amont a retiré ses étiquettes 0.3.x
# (vérifié : `git ls-remote --tags https://github.com/huggingface/hf-hub`
# ne montre plus que v0.4.0+), donc Cargo ne peut plus revalider "0.3.2"
# même avec Cargo.lock présent. Un recouvrement de source Cargo
# (`[source]`/`replace-with`) a été essayé et écarté : ce mécanisme
# exige lui-même un lockfile déjà cohérent avec le remplacement actif
# (chicken-and-egg documenté par Cargo lui-même). Correctif retenu,
# vérifié avant d'être encodé dans ce rôle : `cargo update -p hf-hub
# --precise <ce commit>` — le même commit que Cargo.lock épingle déjà
# (pas une nouvelle fixation arbitraire), qui ne change PAS l'entrée
# hf-hub elle-même (vérifié, `git diff`) mais force une réécriture
# cohérente du lockfile (format 3 → 4) qui corrige au passage un
# décalage sans rapport déjà présent dans le Cargo.lock amont (auto-
# version du paquet lsp-ai : "0.7.0" au lieu de "0.7.1" déclaré par son
# propre Cargo.toml à ce commit). Aucun autre paquet touché (« 262
# unchanged dependencies behind latest »).
completion_hf_hub_pinned_commit: 6303587576f8a1ce9f91f8274265a153b89afb6e

# --- Dépendances de compilation supplémentaires -------------------------
# Découverte en écrivant ce rôle (docs/completion.md § 7.2, cinq
# paquets trouvés successivement, pas en une fois) : `reqwest`
# (dépendance par défaut de lsp-ai, pas seulement du feature
# `llama_cpp`) tire `openssl-sys`, qui compile OpenSSL vendoré depuis
# les sources — la configuration OpenSSL (`Configure`/`configdata.pm`)
# exige plusieurs modules Perl absents de ce poste, jamais nécessaires
# jusqu'ici, établis par lecture exhaustive des `use`/`require` des
# fichiers réellement invoqués (pas un module Perl générique
# « complet ») : `FindBin`, `IPC::Cmd`, `File::Compare`,
# `IO::Socket::INET6`, `Text::Template`. Même exception que rust/cargo
# (« la chaîne de compilation qui vient des dépôts »), fedora/updates
# uniquement — vérifié, `dnf repoquery --available --qf '%{repoid}'`
# sur les cinq ne montre que fedora/updates.
completion_build_extra_packages:
  - perl-FindBin
  - perl-IPC-Cmd
  - perl-File-Compare
  - perl-IO-Socket-INET6
  - perl-Text-Template

# --- Garde (resserrée, D24) : aucun serveur de langage npm, lsp-ai intact -
# [RESSERRÉE le 2026-08-10, D24] ÉTAIT : garde vérifiant l'absence
# totale de node/npm sur le PATH — cassait dès l'installation de GitHub
# Copilot CLI (D24, révision de D12, docs/machine-facts.md § Décisions,
# roles/copilot_cli/), qui ouvre npm sur ce poste pour un usage
# légitime et distinct. Motif complet du resserrement :
# roles/editor/defaults/main.yml (même resserrement, appliqué ici pour
# la même raison — cette garde est la seconde occurrence indépendante
# du même mécanisme D12, découverte en écrivant D24, pas nommée dans la
# demande d'origine). Test d'exécution sur le PATH réel, pas une
# lecture de base rpm — un binaire pourrait provenir d'ailleurs.
# Substituable pour la démonstration d'échec forcé sans jamais changer
# l'état réel du système : -e completion_forbidden_lsp_servers=['sh']
# (garanti présent) casse la garde sans installer quoi que ce soit.
completion_forbidden_lsp_servers:
  - yaml-language-server
  - ansible-language-server

# Chemin attendu du binaire lsp-ai compilé — SOURCE DE VÉRITÉ pour ce
# chemin (completion_bin_dir/completion_bin_name ci-dessus, ce rôle
# est celui qui compile et installe le binaire). Note d'intégrité,
# pas une dépendance fonctionnelle : languages.toml et le client LSP de
# Kate invoquent déjà lsp-ai par CHEMIN ABSOLU
# (templates/languages.toml.j2, templates/kate-lspclient-settings.json.j2)
# — un « lsp-ai » qui apparaîtrait ailleurs sur le PATH (ex. un paquet
# npm global du même nom) ne serait donc jamais consommé par erreur.
# Cette garde protège l'intégrité constatable du poste, pas une
# invocation réelle qui en dépendrait.
completion_lsp_ai_expected_path: "{{ completion_bin_dir }}/{{ completion_bin_name }}"

# --- Garde : service d'inférence local joignable ------------------------
# Jamais une API distante (demande § 2.4) — mêmes valeurs que
# roles/local_ai/defaults/main.yml (local_ai_ollama_bind_address/
# local_ai_ollama_port), reprises ici sans import inter-rôles (ce dépôt
# n'a pas de mécanisme de partage de defaults entre rôles — chaque rôle
# reste autonome, même motif que la reprise délibérée de
# gpu_cdi_verify_spec_path dans roles/local_ai/). Si l'un des deux rôles
# change son adressage, l'autre doit être mis à jour à la main — nommé
# ici pour que ça ne se perde pas.
completion_ollama_host: 127.0.0.1
completion_ollama_port: 11434
completion_ollama_url_check: "http://{{ completion_ollama_host }}:{{ completion_ollama_port }}/api/tags"

# Calculées une fois ici, réutilisées telles quelles dans le template
# ET dans la garde qui relit le fichier déployé — évite toute
# divergence entre ce qui est écrit et ce qui est vérifié (une
# concaténation Jinja recalculée séparément aux deux endroits avait
# produit un faux échec en écrivant ce rôle, corrigé en centralisant
# ici).
completion_ollama_generate_url: "http://{{ completion_ollama_host }}:{{ completion_ollama_port }}/api/generate"
completion_ollama_chat_url: "http://{{ completion_ollama_host }}:{{ completion_ollama_port }}/api/chat"

# Valeurs ATTENDUES par la garde 5/5 (relecture de la configuration
# déployée) — distinctes des valeurs ci-dessus qui pilotent ce qui est
# réellement écrit dans le fichier, même patron que les autres gardes
# substituables de ce dépôt (ex. local_ai_network_internal_expected).
# Par défaut identiques à ce qui est déployé ; substituables par -e
# pour la démonstration d'échec forcé SANS jamais changer ce que le
# fichier réellement déployé contient :
# -e completion_ollama_generate_url_expected=http://exemple.invalide/api/generate
completion_ollama_generate_url_expected: "{{ completion_ollama_generate_url }}"
completion_ollama_chat_url_expected: "{{ completion_ollama_chat_url }}"

# --- Configuration Helix -------------------------------------------------
# Langages auxquels lsp-ai est rattaché (demande § 2.5) — yaml d'abord :
# le plus directement pertinent à ce dépôt (Ansible), et celui dont
# l'absence de serveur était déjà nommée par D12/EDI-1
# (`hx --health yaml` : "not found in $PATH"). python ajouté en IA-4
# (demande § 1 : complétion réelle testée sur les deux). bash ajouté
# (BSH-1, diagnostic : aucune complétion pilotée par modèle pour les
# scripts shell, ni dans Kate ni dans Helix — `pgrep -a lsp-ai` : aucun
# processus lors de l'ouverture d'un script, popup observé = complétion
# interne par mots du document, sans rapport avec lsp-ai). Identifiant
# exact établi par lecture, pas deviné : `hx --health` liste bien
# `bash` comme langage connu de Helix (tree-sitter/highlight/textobject/
# indent tous ✓ sur ce poste) — un seul identifiant, Helix ne distingue
# pas bash/sh/zsh en langages séparés comme le fait Kate (voir
# completion_kate_highlighting_mode_regex ci-dessous).
completion_helix_languages:
  - yaml
  - python
  - bash

completion_helix_config_dir: "{{ ansible_facts.env.HOME }}/.config/helix"

# Garde COR-1 (docs/review-2026-08.md § 4.2) : ce rôle écrit languages.toml
# sans jamais vérifier que Helix est installé — c'est roles/editor/ qui
# l'installe, aucun lien de dépendance déclaré entre les deux rôles.
# Nom sur le PATH, pas un chemin en dur (même discipline que
# completion_forbidden_lsp_servers ci-dessus) — substituable pour la
# démonstration d'échec forcé sans jamais désinstaller Helix :
# -e completion_helix_binary_name=hx-binaire-inexistant-garanti
completion_helix_binary_name: hx

# [CORRIGÉ, IA-4] ÉTAIT `completion_model_placeholder:
# "aucun-modele-charge-D20"` — nom délibérément non résolvable, motivé
# par CMP-1 quand aucun modèle n'existait encore (« pour que la
# complétion échoue de façon visible plutôt que de sembler fonctionner
# par coïncidence »). D21 (IA-3) a depuis choisi et récupéré un modèle
# de complétion réel — le placeholder est resté en place jusqu'à ce
# livrable, causant l'échec exact que le point 5 d'IA-3 a diagnostiqué
# (« model 'aucun-modele-charge-D20' not found », ni lsp-ai ni RTD3en
# cause). Remplacé par le nom réel, en variable — jamais en dur dans le
# gabarit — et vérifié par une garde dédiée (existence côté service,
# pas seulement posé) avant d'écrire la configuration Helix.
completion_ollama_model: "qwen2.5-coder:7b-instruct-q4_K_M"

# Valeur ATTENDUE par la garde d'existence du modèle — distincte de la
# valeur ci-dessus qui pilote ce qui est réellement écrit dans
# languages.toml, même patron que completion_ollama_generate_url_expected
# plus bas. Substituable par -e sans jamais changer le modèle
# réellement configuré :
# -e completion_ollama_model_expected=absent-garanti
completion_ollama_model_expected: "{{ completion_ollama_model }}"

# Contexte/paramètres de complétion.
# [CORRIGÉ, TRO-1, 2026-08-12] ÉTAIT `completion_num_predict: 32` —
# reprise verbatim de l'exemple de test `ollama_config` du code source
# de lsp-ai (crates/lsp-ai/src/config.rs, empreinte
# completion_lsp_ai_commit ci-dessus), jamais mesurée ni arbitrée
# (docs/completion.md § 11.2) — plafonnait systématiquement la
# génération avant toute fin naturelle (≈9,1 ms/jeton mesuré, 32 et 64
# jamais atteints naturellement), causant les complétions tronquées
# signalées par l'opérateur. Porté à 256 : marge maximale, latence
# jusqu'à ≈2,5 s quand la génération va au bout (cas rare d'après la
# mesure — la plupart des complétions s'arrêtent naturellement bien
# avant ce plafond, docs/completion.md § 12.1) — **la garantie de
# réponse rapide au fil de la frappe est perdue au profit de la
# complétude** ; décision de l'opérateur, assumée comme telle.
completion_num_predict: 256

# `max_context` (lsp-ai) : interne au memory backend `file_store`
# (portion de fichier extraite autour du curseur, `tokens * 4`
# caractères estimés, docs/completion.md § 11.1) — **jamais transmis à
# Ollama**, sans coût VRAM. Valeur inchangée (2000 ≈ 8000 caractères),
# aucune mesure ne justifiait de la revoir dans ce livrable.
completion_max_context: 2000

# [AJOUTÉ, TRO-1, 2026-08-12] `num_ctx` — fenêtre de contexte du
# modèle Ollama lui-même (distinct de `max_context` ci-dessus,
# vérifié par lecture : transmis dans `options`, même niveau que
# `num_predict`, crates/lsp-ai/src/transformer_backends/ollama.rs) —
# **n'était jamais exposé par ce rôle avant ce livrable**, le modèle
# tournait au défaut Ollama (4096, pas les 32 K annoncés par la fiche
# du modèle, confirmé par `ollama ps`/`curl .../api/ps` avant
# correction). Coût VRAM mesuré par palier (docs/completion.md § 12.2) :
# ≈4,4 GiB (4096, actuel) → ≈6,1 GiB (32768), effet négligeable sur la
# latence de traitement du prompt (10 ms, quel que soit le palier —
# la latence de génération dépend de `num_predict`, pas de `num_ctx`),
# mais un rechargement du modèle résident (D15) est nécessaire pour
# qu'un changement prenne effet (≈6,5 s mesurés, une fois, pas à
# chaque requête). **Valeur retenue : 4096 (inchangée)** — un
# élargissement mesuré compromettrait la marge disponible pour le
# chargement séquentiel du modèle de chat (D22) sans bénéfice mesuré
# sur les fichiers réels de ce dépôt (quelques centaines de lignes,
# jamais assez pour saturer 4096 jetons de contexte extrait par
# `max_context`/`file_store`, docs/completion.md § 12.2). Exposée en
# variable pour que ce choix soit revisable sans devoir relire le
# code source de lsp-ai une seconde fois.
completion_num_ctx: 4096

# [AJOUTÉ, TRO-4, 2026-08-12] Jetons FIM (remplissage au milieu),
# sourcés directement sur le modèle installé — pas devinés, pas repris
# d'une documentation générique sur les modèles de la famille Qwen.
# Lus par lecture du gabarit exposé par Ollama lui-même :
#   curl -s http://127.0.0.1:11434/api/show \
#     -d '{"model":"qwen2.5-coder:7b-instruct-q4_K_M"}' \
#     | python3 -c "import json,sys;print(json.load(sys.stdin)['template'])"
# → `{{- if .Suffix }}<|fim_prefix|>{{ .Prompt }}<|fim_suffix|>{{ .Suffix }}<|fim_middle|>`
# **Couplage à consigner** : ces trois valeurs sont propres au modèle
# retenu (`completion_ollama_model`), pas à `lsp-ai` — changer de
# modèle (D21 à revoir) invaliderait ces jetons sans qu'aucune erreur
# ne le signale nécessairement à l'écriture de la configuration (la
# garde ci-dessous vérifie la cohérence interne des trois valeurs,
# jamais leur exactitude vis-à-vis du modèle réellement chargé — une
# vérification par lecture du gabarit du modèle reste nécessaire à
# chaque changement de modèle, docs/completion.md § 15.1).
completion_fim_start: "<|fim_prefix|>"
completion_fim_middle: "<|fim_suffix|>"
completion_fim_end: "<|fim_middle|>"

# [AJOUTÉ, TRO-2, 2026-08-12] Bornes de `completion_num_predict` et
# `completion_num_ctx` — motif de chacune consigné dans le message de
# la garde (roles/completion/tasks/main.yml) et détaillé dans
# docs/completion.md § 13.1. Aucune borne sur `completion_max_context` :
# paramètre interne au memory backend de lsp-ai, jamais transmis à
# Ollama, sans coût VRAM (§ 11.1) — une borne y serait de la
# sur-couverture, pas posée délibérément.
#
# completion_num_predict_min=1 : 0 et les valeurs négatives (-1, -2)
# signifient « génération non bornée » côté Ollama (vérifié par appel
# direct à l'API — num_predict=-1 a produit 1334 jetons en une seule
# réponse, num_predict=0 s'est arrêté naturellement à 65 mais sans
# plafond garanti) — c'est le risque exact qu'une borne basse doit
# écarter, pas une valeur de complétion faible mais plausible.
completion_num_predict_min: 1

# completion_num_predict_max=512 : mesuré directement contre l'API
# (docs/completion.md § 13.1) — 384 jetons ≈3,8 s, 512 ≈4,8 s, 768
# ≈7,5 s, 1024 ≈9,7 s. Au-delà de 512, la latence dépasse largement ce
# qui reste utilisable au fil de la frappe même en tolérant la
# contrepartie déjà assumée pour 256 (~2,5 s) ; 512 reste une borne
# haute généreuse (le double de la valeur retenue) sans franchir le
# palier où l'attente devient un blocage net (~7-10 s).
completion_num_predict_max: 512

# completion_num_ctx_min=512 : en dessous, le prompt système + gabarit
# de lsp-ai (~30 jetons mesurés côté prompt_eval_count pour un prompt
# minimal) occupe déjà une fraction significative de la fenêtre — à
# 64-256 jetons de contexte total mesurés par appel direct, la
# complétion produite reste cohérente sur le plan syntaxique mais perd
# tout accès au fichier réel au-delà de quelques lignes (docs/completion.md
# § 13.1) : la complétion perd son sens utilitaire pour ce dépôt, pas
# parce qu'elle échoue techniquement.
completion_num_ctx_min: 512

# completion_num_ctx_max=32768 : fenêtre de contexte maximale déclarée
# par le modèle lui-même, jamais devinée — `qwen2.context_length` relevé
# par lecture directe (`curl .../api/show` sur le modèle configuré,
# champ `model_info["qwen2.context_length"]`). Au-delà, la valeur
# demandée à Ollama est acceptée sans erreur mais `ollama ps` continue
# de rapporter 32768 (plafonnée silencieusement au maximum du modèle,
# vérifié par mesure directe avec num_ctx=99999999) — une valeur
# supérieure à cette borne ne produirait donc pas l'effet demandé,
# c'est le motif de la borne haute, pas une limite arbitraire.
completion_num_ctx_max: 32768

# Substituable pour la démonstration d'échec forcé du service (§ 3 de
# la demande) sans jamais changer le service réel :
# -e completion_ollama_url_check=http://127.0.0.1:1/api/tags
completion_service_wait_retries: 3
completion_service_wait_delay: 2

# --- Configuration Kate (KAT-1) -------------------------------------------
# Résolution avant configuration (demande § 1) : greffon `lspclientplugin`
# (paquet `kate-plugins`, déjà installé — `roles/editor/`, EDI-1, vérifié
# de nouveau ici, aucune installation requise par ce livrable). Fichier de
# configuration dédié (jamais une copie d'un fichier Plasma) — chemin
# sourcé dans `lspclientplugin.cpp`, tag v26.04.3 :
# `QStandardPaths::AppConfigLocation` (`~/.config/kate`) + `/lspclient/
# settings.json` — confirmé empiriquement (le répertoire
# `~/.config/kate/lspclient/` existe déjà, auto-créé au premier chargement
# du greffon, vide). Format sourcé dans `lspclientservermanager.cpp` (même
# tag) : objet JSON `servers.<langid>`, fusionné (`json::merge`, pas
# remplacé) avec les définitions livrées avec Kate (`addons/lspclient/
# settings.json` amont) — une entrée utilisateur pour "python"/"yaml"
# l'emporte sur celle livrée avec Kate pour ce même identifiant.
# **Un seul serveur actif par (racine, identifiant de langage)** — pas de
# cohabitation possible (`m_servers[root][langId]`, sourcé) : sans
# conséquence ici, les serveurs par défaut de Kate pour ces langages
# (`pylsp`, `yaml-language-server`) sont absents de ce poste (vérifié,
# `command -v`) — aucune fonction de diagnostic/navigation n'est
# déplacée, l'arbitrage évoqué par la demande § 1 (« complétion ou reste
# des fonctions LSP ») ne se pose pas dans les faits sur cette machine.
completion_kate_config_dir: "{{ ansible_facts.env.HOME }}/.config/kate"
completion_kate_lspclient_settings_path: "{{ completion_kate_config_dir }}/lspclient/settings.json"

# Même binaire, même modèle, même API locale que Helix — jamais une
# seconde configuration divergente (motif de la demande § 2 : le défaut
# déjà rencontré pour `ansible-lint`/ANS-1 et `yamllint`/EDI-1, sous une
# troisième forme). Réutilise les variables déjà posées pour Helix
# ci-dessus (`completion_bin_dir`/`completion_bin_name`,
# `completion_ollama_generate_url`/`completion_ollama_chat_url`,
# `completion_ollama_model`, `completion_max_context`/`completion_num_predict`/
# `completion_num_ctx`)
# — jamais une seconde copie de valeur.
completion_kate_languages: "{{ completion_helix_languages }}"

# Nom sur le PATH (pas un chemin en dur) — même discipline que
# completion_helix_binary_name : garde dédiée avant d'écrire la
# configuration Kate, substituable pour la démonstration d'échec forcé
# sans jamais désinstaller Kate :
# -e completion_kate_binary_name=kate-binaire-inexistant-garanti
completion_kate_binary_name: kate

# Correspondance exacte des modes de coloration Kate par langage — sourcée
# dans le fichier `settings.json` livré avec Kate (`addons/lspclient/
# settings.json`, tag v26.04.3), pas supposée : `"^YAML$"` pour yaml,
# `"^Python$"` pour python. Reprise à l'identique pour que l'entrée
# utilisateur corresponde exactement au même critère que celle qu'elle
# remplace par fusion.
#
# bash (BSH-1) : le nom du mode de coloration syntaxique n'est PAS
# devinable depuis l'extension — établi par mesure sur ce poste, pas
# supposé. `ksyntaxhighlighter6 --list` (paquet kf6-syntax-highlighting
# 6.28.1, celui que Kate lie réellement) liste deux définitions
# distinctes couvrant ce domaine : « Bash » et « Zsh ». Comparaison de
# rendu forcé (`-s Bash` / `-s Zsh`) contre l'auto-détection confirme
# qu'un fichier `.sh` (quel que soit son shebang) résout vers « Bash »,
# qu'un fichier `.bash` résout aussi vers « Bash », et que seul `.zsh`
# résout vers « Zsh » — l'opérateur écrit « bash et shell », jamais
# zsh : une seule entrée ajoutée, pas deux, pour ne pas multiplier les
# entrées inutiles. Confirmé de façon indépendante par le fichier
# `settings.json` livré avec Kate lui-même (même source amont que
# ci-dessus, tag v26.04.3) : son entrée `servers.bash` porte
# exactement `"highlightingModeRegex": "^Bash$"` — même regex, même clé
# `bash`, valeur retenue ici par coïncidence de méthode, pas copiée
# sans vérification indépendante.
completion_kate_highlighting_mode_regex:
  yaml: "^YAML$"
  python: "^Python$"
  bash: "^Bash$"
