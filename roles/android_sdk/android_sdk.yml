---
# Playbook d'exécution/test du rôle android_sdk, ciblant localhost.
# `role: "{{ playbook_dir }}"` charge ce répertoire lui-même comme rôle
# — même patron que roles/android_jdk/android_jdk.yml, lui-même calqué
# sur roles/recovery/recovery.yml.
- name: Android SDK — installe les command-line tools et accepte les licences
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: "{{ playbook_dir }}"
