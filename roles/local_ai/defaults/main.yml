---
# Décisions de l'opérateur (docs/machine-facts.md § Décisions — numéros
# vérifiés libres avant attribution, IA-1) :
#   D14 — service d'inférence : Ollama conteneurisé, image CUDA
#         officielle, accès GPU par CDI (seule voie qui atteigne la
#         RTX 4090, IA-0 § 3.1 — aucune voie native ne le peut).
#   D15 — modèle de complétion résident en permanence (keep_alive
#         infini) — contrepartie assumée : RTD3 ne s'engage plus tant
#         que le service tourne (docs/local-ai.md § 2.1/2.2).
#   D16 — NVreg_PreserveVideoMemoryAllocations=1 — contrepartie
#         assumée : suspension/réveil système plus lents.
#   D17 — dimensionnement initial 13 B / Q4_K_M, à mesurer avant toute
#         montée — [DÉTAILLÉ par D21] modèles réellement choisis.
#   D21 — chat/agent : mistral-nemo:12b-instruct-2407-q4_K_M
#         (Apache-2.0, contexte visé 32 K — motif de licence : dépôt
#         public destiné à être cloné en entreprise, la Llama 2
#         Community License de codellama:13b y porterait des
#         restrictions). Complétion : qwen2.5-coder:7b-instruct-q4_K_M
#         (Apache-2.0, FIM confirmé). Écarté : qwen2.5-coder:3b, seule
#         taille restreinte (Qwen Research License) d'une famille par
#         ailleurs Apache-2.0 — écarté sur le seul motif de licence,
#         sans lecture de ses termes complets (le motif suffit).
#         Récupérés par un conteneur de récupération distinct,
#         éphémère, jamais attaché au réseau du service
#         (docs/local-ai.md § 9).

# --- D14 : image Ollama, épinglée par empreinte, pas par étiquette ---
# ---------------------------------------------------------------------
# "latest" et "0.32.6" pointent, au moment de l'écriture de ce rôle
# (2026-08-07), vers la même empreinte (`skopeo inspect`, vérifié) —
# épinglée ici par empreinte pour que ce rôle ne suive jamais
# silencieusement une étiquette mobile (D1/traçabilité, § 5 de la
# demande). Empreinte de l'INDEX multi-architecture (manifest list,
# `skopeo inspect --raw` confirme `image.index.v1+json`), pas celle
# d'un manifeste par architecture — Podman résout lui-même la
# plateforme locale (amd64) à partir de cet index, comportement OCI
# standard, pas une particularité de ce rôle.
local_ai_ollama_image_ref: docker.io/ollama/ollama
local_ai_ollama_image_digest: sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
local_ai_ollama_image: "{{ local_ai_ollama_image_ref }}@{{ local_ai_ollama_image_digest }}"

# API exposée en local uniquement — jamais sur une interface externe.
# 127.0.0.1 explicite (pas 0.0.0.0 implicite d'un mappage de port sans
# adresse) : Quadlet PublishPort= documente ce comportement par défaut
# comme lié à toutes les IPv4 de l'hôte si l'IP est omise — jamais omise
# ici, précisément pour ne pas en dépendre.
local_ai_ollama_bind_address: 127.0.0.1
local_ai_ollama_port: 11434

# D15 — keep_alive infini pour le modèle résident (complétion). Valeur
# du pilote Ollama documentée en amont : toute valeur négative maintient
# le chargement indéfiniment (docs/local-ai.md § 3.2, IA-0).
local_ai_ollama_keep_alive: "-1"

# --- IA-2 §1 : confinement de la sortie réseau non sollicitée --------
# Voie retenue après mesure (docs/local-ai.md § 8) : réseau Podman dédié
# --internal (aucune route de sortie, PublishPort préservé — vérifié,
# distinct d'un réseau --network=none qui casse PublishPort) en garde
# structurelle, vérifiable de l'extérieur ; OLLAMA_NO_CLOUD=1 en
# complément, vérifié par mesure comme réellement efficace (pas une
# désactivation cosmétique).
local_ai_network_unit_name: ollama
local_ai_network_internal: true

# Substituable pour la démonstration d'échec forcé de la garde réseau
# (§ 2.5 de la demande), sans jamais changer le réseau réellement
# déployé — même patron que local_ai_podman_rootless_expected ci-dessus :
# -e local_ai_network_internal_expected=false
local_ai_network_internal_expected: "true"

local_ai_ollama_no_cloud: "1"

# Substituable pour la démonstration d'échec forcé de la garde cloud,
# sans jamais changer la configuration réellement déployée — la garde
# relit l'annonce que le serveur Ollama lui-même écrit dans son propre
# journal (effet constaté, pas la variable qu'on lui a posée) :
# -e local_ai_cloud_disabled_expected=false
local_ai_cloud_disabled_expected: "true"

# --- D16 : paramètre pilote, écrasement propre, jamais le fichier fournisseur
# -----------------------------------------------------------------------
# Jamais /usr/lib/modprobe.d/nvidia-power-management.conf (fichier
# fourni par le paquet xorg-x11-drv-nvidia-power, `rpm -qf` vérifié) —
# un nom de fichier DIFFÉRENT dans /etc/modprobe.d/ : `man modprobe.d`
# est explicite, deux fichiers de MÊME NOM dans des répertoires de
# précédence différents s'excluent (seul le premier chargé compte),
# alors que des fichiers de noms différents s'additionnent ("all
# options are added together"). Un nom différent, pas un écrasement par
# homonymie, pour ne jamais rendre invisible une future mise à jour du
# fichier fournisseur (actuellement sans effet : sa ligne
# NVreg_PreserveVideoMemoryAllocations est commentée, vérifié IA-0/ici).
local_ai_modprobe_dir: /etc/modprobe.d
local_ai_modprobe_file: "{{ local_ai_modprobe_dir }}/local-ai-nvidia-power-management.conf"
local_ai_nvidia_provider_conf: /usr/lib/modprobe.d/nvidia-power-management.conf
local_ai_nvidia_provider_package: xorg-x11-drv-nvidia-power

# --- D14 : mécanisme de service — Quadlet Podman, pas une unité écrite à la main
# ---------------------------------------------------------------------------
# Podman 5.8.4 fournit nativement un générateur Quadlet utilisateur
# (`/usr/lib/systemd/user-generators/podman-user-generator`, vérifié
# présent) : des fichiers déclaratifs `.container`/`.volume` dans
# ~/.config/containers/systemd/ sont transformés en unités systemd
# utilisateur réelles au `daemon-reload` — CLAUDE.md § déterminer ce
# que l'outil gère déjà, appliqué : pas d'unité `.service` écrite à la
# main appelant `podman run`.
local_ai_quadlet_dir: "{{ ansible_facts.env.HOME }}/.config/containers/systemd"
local_ai_service_name: ollama
local_ai_volume_name: ollama-models

# --- D21 : récupération des modèles par conteneur éphémère distinct ----
# ---------------------------------------------------------------------
# Motif (demande § 1, IA-3) : `podman network connect` temporaire sur
# le conteneur de service (docs/local-ai.md § 8.5, proposé en IA-2)
# affaiblirait la propriété que le confinement réseau établit — le
# service cesserait d'être vérifiablement isolé pendant l'opération,
# la garantie redeviendrait une question de discipline plutôt qu'un
# fait structurel. Retenu à la place : un second conteneur, jamais
# démarré par défaut (tag `pull-models`, jamais dans les tâches
# normales de ce rôle), qui partage le MÊME volume de modèles que le
# service mais SANS le réseau interne dédié — aucun `Network=` n'est
# passé à `podman run`, donc le réseau rootless par défaut de Podman
# (pasta, avec sortie) s'applique, entièrement disjoint de
# `systemd-{{ local_ai_network_unit_name }}`. Le conteneur de service
# ne reçoit ainsi jamais d'accès externe, à aucun moment — vérifiable
# par inspection avant/pendant/après, pas par affirmation
# (docs/local-ai.md § 9.1).
local_ai_recovery_container_name: ollama-recovery

# Les deux seuls modèles de ce livrable (D21) — aucun autre nom ne doit
# apparaître dans les tâches taguées `pull-models`.
local_ai_models_to_pull:
  - mistral-nemo:12b-instruct-2407-q4_K_M
  - qwen2.5-coder:7b-instruct-q4_K_M

# --- Modèles : répertoire simple, pas de sous-volume btrfs dédié -----
# Aucun outil de snapshot (snapper/timeshift/btrfs-assistant) n'est
# installé sur ce poste (vérifié, `rpm -qa`) — un sous-volume dédié
# n'apporterait ni exclusion de snapshot, ni quota séparé, faute de
# régime de snapshot à en exclure. Abstention justifiée (demande § 1) :
# les poids vivent dans un volume Podman nommé ordinaire (géré par
# Quadlet, § local_ai_volume_name), sur le btrfs Data,single déjà en
# place (D1) — sous l'arborescence de stockage rootless standard de
# Podman, pas un chemin inventé par ce rôle.

# --- Gardes préalables (§ 2.1 de la demande), toutes échec bruyant ---
# Réutilise verify-cdi-spec (roles/gpu_cdi), ne le réimplémente pas —
# chemin résolu relativement à ce rôle (D1 : reconstructible quel que
# soit l'emplacement de clonage du dépôt), pas en dur.
local_ai_gpu_cdi_playbook: "{{ (playbook_dir + '/../gpu_cdi/gpu_cdi.yml') | realpath }}"

# Chemin résolu (pas supposé /usr/bin) — la garde de service (§ 2.4)
# doit invoquer le même binaire que celui utilisé pour dérouler ce
# rôle, pas une hypothèse sur le PATH d'une unité systemd exécutée bien
# plus tard, dans un contexte différent.
local_ai_ansible_playbook_bin: "{{ lookup('pipe', 'command -v ansible-playbook') }}"

# Paramétrable pour la démonstration d'échec forcé (§ 3 de la demande) :
# -e gpu_cdi_verify_spec_path=<chemin invalide>. Même nom de variable
# que roles/gpu_cdi/defaults/main.yml, même valeur par défaut — pas une
# redéfinition divergente : reprise délibérée du nom du rôle réutilisé
# (gpu_cdi), pas du préfixe local_ai_, pour que la variable qui pilote
# gpu_cdi.yml --tags verify-cdi-spec porte le même nom des deux côtés
# de l'appel. `ansible-lint` (var-naming[no-role-prefix]) le signale —
# dérogation justifiée ici, pas un oubli de préfixe.
gpu_cdi_verify_spec_path: /etc/cdi/nvidia.yaml  # noqa: var-naming[no-role-prefix]

# Paramétrable pour la deuxième démonstration d'échec forcé : un nom de
# module garanti absent casse la garde sans jamais toucher au système
# réel (même patron que la garde D12 de roles/editor/, EDI-1).
local_ai_required_kernel_module: nvidia_uvm

# Valeur attendue de `podman info --format {{.Host.Security.Rootless}}`
# — forceable à `false` pour la démonstration d'échec sans jamais
# changer la configuration Podman réelle.
local_ai_podman_rootless_expected: "true"

# Attente de l'API après démarrage — généreuse par défaut : le premier
# démarrage tire l'image (plusieurs gigaoctets possibles pour une image
# CUDA) avant que le serveur n'écoute.
local_ai_api_wait_retries: 60
local_ai_api_wait_delay: 10

# --- IA-4 § 2 : intégrité des blobs au repos --------------------------
# Motif complet : docs/local-ai.md § 9.2 (IA-3) — `ollama pull` vérifie
# ce qu'il reçoit du réseau, jamais un blob déjà présent localement,
# corrompu après coup. Script autonome (aucune dépendance à Ansible ni
# à ce rôle une fois déployé), lecture seule stricte — voir
# roles/local_ai/templates/verify-model-integrity.sh.j2 pour le motif
# détaillé et la garantie de non-écriture. Domaine utilisateur
# uniquement, même répertoire que le binaire compilé par
# roles/completion/ (~/.local/bin), pas /usr/local/.
local_ai_verify_integrity_script_name: verify-model-integrity.sh
local_ai_verify_integrity_dest: "{{ ansible_facts.env.HOME }}/.local/bin/{{ local_ai_verify_integrity_script_name }}"

# --- IA-4 § 3 : déclencheurs de la vérification CDI --------------------
# Le mécanisme (verify-cdi-spec, roles/gpu_cdi) existait déjà depuis
# IA-1 sans rien qui le déclenche, hors du seul ExecStartPre du service
# lui-même (roles/local_ai/templates/ollama.container.j2) — qui ne
# couvre que le (re)démarrage du service, pas une mise à jour de pilote
# survenant PENDANT qu'il tourne déjà (le service est conçu pour rester
# actif indéfiniment, D15/D20 : keep_alive infini côté modèle,
# ExecStartPre ne se rejoue qu'à un (re)démarrage qui peut ne jamais
# survenir). Second levier : minuterie systemd --user périodique,
# indépendante du service, plus unité de notification visible
# (OnFailure=) — une vérification périodique dont l'échec ne se voit
# nulle part équivaut à une vérification qui n'existe pas (demande § 3).
local_ai_cdi_timer_base_name: local-ai-cdi-verify
local_ai_cdi_notify_service_name: "{{ local_ai_cdi_timer_base_name }}-notify"

# Fréquence : aucun dnf-automatic actif sur ce poste (vérifié,
# `systemctl list-unit-files` ne montre aucune unité dnf-automatic-*) —
# les mises à jour du pilote NVIDIA sont déclenchées manuellement
# (`sudo dnf upgrade`), pas en continu. Horaire (avec `Persistent=true`
# pour rattraper une exécution manquée après veille/suspension) donne
# une marge confortable entre une mise à jour manuelle et sa détection,
# pour un coût négligeable (une invocation `ansible-playbook`, quelques
# centaines de ms, par heure).
local_ai_cdi_timer_oncalendar: hourly

# Notification visible en cas d'échec — notify-send (libnotify, déjà
# présent, vérifié `rpm -q libnotify`), sur le bus D-Bus de la session
# graphique réelle (systemd --user partage cette session, pas un bus
# isolé). Pas de dépendance nouvelle : aucun paquet à installer.
local_ai_cdi_notify_urgency: critical

# Unités systemd --user PLATES (pas Quadlet — aucun conteneur ici),
# emplacement standard, distinct de local_ai_quadlet_dir.
local_ai_systemd_user_dir: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
