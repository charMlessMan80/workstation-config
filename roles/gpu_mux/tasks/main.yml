---
# Ce rôle écrit gpu_mux_mode et s'arrête — il ne redémarre JAMAIS la
# machine, n'écrit JAMAIS dans dgpu_disable, ne démarre ni n'active
# supergfxd, n'installe aucun paquet. La bascule n'est prouvée qu'après un
# redémarrage déclenché manuellement, hors de ce rôle : voir
# docs/gpu-mux-recovery.md.

# --- Garde 0 : chemin de retour SSH réellement opérationnel MAINTENANT --
# Motif (docs/review-2026-08.md § 4.1, COR-1) : une bascule ratée suivie
# d'un redémarrage qui tourne mal doit pouvoir compter sur un accès de
# secours — la seule garantie qui vaille est l'état constaté à cet
# instant, pas le souvenir qu'un rôle de préparation a tourné un jour.
# Trois vérifications, toutes en lecture seule : ce rôle n'active jamais
# sshd, n'écrit jamais dans authorized_keys, ne touche jamais firewalld —
# corriger une dérive détectée ici est le mandat de roles/recovery/, pas
# de celui-ci (CLAUDE.md § éviter la réparation automatique qui masque une
# dérive : cette garde échoue bruyamment, elle ne rejoue jamais recovery).

- name: "Garde 0a — relever l'état réel de sshd (actif, activé au démarrage)"
  ansible.builtin.service_facts:

- name: >-
    Déterminer l'état effectif de sshd (réel, ou forcé pour la
    démonstration d'échec (c) — jamais modifié, seulement lu/simulé)
  ansible.builtin.set_fact:
    gpu_mux_sshd_active: >-
      {{ gpu_mux_force_sshd_active
         if gpu_mux_force_sshd_active is defined
         else (ansible_facts.services[gpu_mux_recovery_ssh_service + '.service'].state | default('absent') == 'running') }}
    gpu_mux_sshd_enabled: >-
      {{ gpu_mux_force_sshd_enabled
         if gpu_mux_force_sshd_enabled is defined
         else (ansible_facts.services[gpu_mux_recovery_ssh_service + '.service'].status | default('absent') == 'enabled') }}

- name: >-
    Échouer bruyamment si sshd n'est pas actif ET activé au démarrage,
    MAINTENANT (ou si l'état a été substitué pour la démonstration)
  ansible.builtin.assert:
    that:
      - gpu_mux_sshd_active | bool
      - gpu_mux_sshd_enabled | bool
    fail_msg: >-
      sshd n'est pas prêt à servir de chemin de retour MAINTENANT — actif :
      {{ gpu_mux_sshd_active }}, activé au démarrage : {{ gpu_mux_sshd_enabled }}.
      Ce rôle ne démarre ni n'active jamais sshd lui-même (ce n'est pas son
      mandat) : exécuter roles/recovery/recovery.yml, vérifier qu'il
      corrige réellement l'état, puis relancer ce rôle — ne PAS basculer
      le MUX tant que ce chemin de retour n'est pas confirmé opérationnel.
    success_msg: "sshd actif et activé au démarrage, confirmé maintenant."

- name: "Garde 0b — vérifier la présence du fichier authorized_keys sur ce poste"
  ansible.builtin.stat:
    path: "{{ gpu_mux_recovery_authorized_keys_path }}"
  register: gpu_mux_authorized_keys_stat
  # Toujours exécutée, même quand une valeur est forcée pour la
  # démonstration (c) : une lecture stat seule, sans condition à
  # court-circuiter — même patron que roles/recovery/tasks/main.yml, qui
  # ne la conditionne pas non plus.

- name: >-
    Compter les clés publiques présentes (lignes non vides, non
    commentées — jamais leur contenu)
  ansible.builtin.command:
    cmd: >-
      grep -Ecv '^[[:space:]]*(#.*)?$' {{ gpu_mux_recovery_authorized_keys_path | ansible.builtin.quote }}
  register: gpu_mux_authorized_keys_count_raw
  changed_when: false
  failed_when: false
  check_mode: false  # lecture seule : mêmes raisons que roles/recovery/tasks/main.yml
  # Une seule expression Jinja (court-circuit garanti), pas une liste de
  # conditions : évite de déréférencer .stat.exists quand la variable
  # forcée dispense déjà de lire le fichier réel.
  when: >-
    gpu_mux_force_authorized_keys_count is not defined
    and gpu_mux_authorized_keys_stat.stat.exists

- name: >-
    Déterminer le nombre effectif de clés (réel, ou forcé pour la
    démonstration d'échec (c) — jamais écrit, seulement lu/simulé)
  ansible.builtin.set_fact:
    gpu_mux_authorized_keys_count: >-
      {{ gpu_mux_force_authorized_keys_count
         if gpu_mux_force_authorized_keys_count is defined
         else (gpu_mux_authorized_keys_count_raw.stdout | default('0')) }}

- name: >-
    Échouer bruyamment si aucune clé publique n'est présente MAINTENANT
    dans authorized_keys (ou si le compte a été substitué pour la
    démonstration)
  ansible.builtin.assert:
    that:
      - (gpu_mux_authorized_keys_count | int) > 0
    fail_msg: >-
      Aucune clé publique utilisable trouvée maintenant dans
      {{ gpu_mux_recovery_authorized_keys_path }} ({{ gpu_mux_authorized_keys_count }}
      trouvée(s)). Le chemin de retour SSH ne peut pas fonctionner sans
      clé autorisée sur CE poste — ajouter la clé publique de la machine
      distante (roles/recovery/, docs/gpu-mux-recovery.md), vérifier,
      puis relancer ce rôle. Ne PAS basculer le MUX sans cette clé.
    success_msg: >-
      {{ gpu_mux_authorized_keys_count }} clé(s) publique(s) confirmée(s)
      maintenant dans {{ gpu_mux_recovery_authorized_keys_path }}.

- name: "Garde 0c — relever l'état réel de la règle firewalld pour SSH (lecture seule)"
  ansible.builtin.command:
    cmd: "firewall-cmd --query-service={{ gpu_mux_recovery_firewall_service }}"
  register: gpu_mux_firewall_ssh_raw
  changed_when: false
  check_mode: false
  failed_when: gpu_mux_firewall_ssh_raw.rc not in [0, 1]
  when: gpu_mux_force_firewall_ssh_allowed is not defined
  # noqa: command-instead-of-module — même motif que roles/recovery/tasks/main.yml :
  # aucun module ansible.builtin ne couvre firewalld, community.general non installé.

- name: >-
    Déterminer si firewalld autorise SSH sur la zone active (réel, ou
    forcé pour la démonstration d'échec (c) — jamais modifié, seulement
    lu/simulé)
  ansible.builtin.set_fact:
    gpu_mux_firewall_ssh_allowed: >-
      {{ gpu_mux_force_firewall_ssh_allowed
         if gpu_mux_force_firewall_ssh_allowed is defined
         else (gpu_mux_firewall_ssh_raw.rc | default(1) == 0) }}

- name: >-
    Échouer bruyamment si firewalld n'autorise pas SSH sur la zone active
    MAINTENANT (ou si l'état a été substitué pour la démonstration)
  ansible.builtin.assert:
    that:
      - gpu_mux_firewall_ssh_allowed | bool
    fail_msg: >-
      firewalld n'autorise pas le service « {{ gpu_mux_recovery_firewall_service }} »
      sur la zone active, maintenant. Le chemin de retour SSH serait
      bloqué par le pare-feu — corriger (hors de ce rôle, qui ne modifie
      jamais firewalld), vérifier avec `firewall-cmd --query-service=
      {{ gpu_mux_recovery_firewall_service }}`, puis relancer.
    success_msg: >-
      firewalld autorise « {{ gpu_mux_recovery_firewall_service }} » sur
      la zone active, confirmé maintenant.

# --- Garde 1 : dgpu_disable doit valoir 0 -----------------------------
# Le pilote refuse la commutation MUX si la dGPU est désactivée. Première
# garde matérielle (après la garde 0, sur le chemin de retour humain, qui
# la précède désormais — COR-1) et vérifiée avant toute écriture : voir
# CLAUDE.md § Matériel spécifique — GPU / MUX.

- name: Relever dgpu_disable réel (sauf si une valeur est forcée pour test)
  ansible.builtin.command:
    cmd: "cat {{ gpu_mux_dgpu_disable_dir }}/current_value"
  register: gpu_mux_dgpu_disable_raw
  changed_when: false
  check_mode: false
  when: gpu_mux_force_dgpu_disable_value is not defined

- name: >-
    Déterminer la valeur effective de dgpu_disable (réelle, ou forcée pour
    la démonstration d'échec (b) — jamais écrite, seulement lue/simulée)
  ansible.builtin.set_fact:
    gpu_mux_dgpu_disable_value: >-
      {{ gpu_mux_force_dgpu_disable_value
         if gpu_mux_force_dgpu_disable_value is defined
         else gpu_mux_dgpu_disable_raw.stdout }}

- name: Échouer bruyamment si dgpu_disable n'est pas à 0 (avant toute écriture)
  ansible.builtin.assert:
    that:
      - gpu_mux_dgpu_disable_value | string == "0"
    fail_msg: >-
      dgpu_disable vaut {{ gpu_mux_dgpu_disable_value }}, pas 0 : le pilote
      refuse la commutation MUX tant que la dGPU est désactivée. Ce rôle
      n'écrit jamais dans dgpu_disable — corriger cet attribut manuellement
      (hors de ce rôle) avant de relancer.
    success_msg: "dgpu_disable = 0, commutation MUX possible."

# --- Garde 2 : l'attribut gpu_mux_mode existe et accepte la valeur cible

- name: Vérifier l'existence de l'attribut gpu_mux_mode
  ansible.builtin.stat:
    path: "{{ gpu_mux_mode_dir }}/current_value"
  register: gpu_mux_mode_attribute_stat

- name: Relever gpu_mux_mode/possible_values
  ansible.builtin.command:
    cmd: "cat {{ gpu_mux_mode_dir }}/possible_values"
  register: gpu_mux_mode_possible_values
  changed_when: false
  check_mode: false
  when: gpu_mux_mode_attribute_stat.stat.exists

- name: Relever gpu_mux_mode/current_value (état avant écriture)
  ansible.builtin.command:
    cmd: "cat {{ gpu_mux_mode_dir }}/current_value"
  register: gpu_mux_mode_current
  changed_when: false
  check_mode: false
  when: gpu_mux_mode_attribute_stat.stat.exists

- name: >-
    Échouer bruyamment si gpu_mux_mode est absent ou si la valeur cible
    n'est pas dans possible_values
  ansible.builtin.assert:
    that:
      - gpu_mux_mode_attribute_stat.stat.exists
      - (gpu_mux_target_value | string) in (gpu_mux_mode_possible_values.stdout | default('') | split(';'))
    fail_msg: >-
      {{ "gpu_mux_mode introuvable sous " ~ gpu_mux_mode_dir
         if not gpu_mux_mode_attribute_stat.stat.exists
         else "Valeur cible " ~ gpu_mux_target_value ~
              " absente de possible_values (" ~
              (gpu_mux_mode_possible_values.stdout | default('inconnu')) ~
              ") — vérifier gpu_mux_target_value avant de relancer." }}
    success_msg: >-
      gpu_mux_mode présent, valeur cible {{ gpu_mux_target_value }} valide
      parmi {{ gpu_mux_mode_possible_values.stdout }}.

# --- Garde 3 : pending_reboot doit valoir 0 avant écriture --------------
# Une modification firmware déjà en attente rendrait la confirmation
# post-écriture inexploitable : on ne pourrait plus distinguer un
# pending_reboot=1 dû à CE rôle d'un pending_reboot=1 déjà présent avant.

- name: Relever pending_reboot avant écriture
  ansible.builtin.command:
    cmd: "cat {{ gpu_mux_pending_reboot_path }}"
  register: gpu_mux_pending_reboot_before
  changed_when: false
  check_mode: false

- name: Échouer bruyamment si pending_reboot n'est pas à 0 avant écriture
  ansible.builtin.assert:
    that:
      - gpu_mux_pending_reboot_before.stdout | string == "0"
    fail_msg: >-
      pending_reboot vaut déjà {{ gpu_mux_pending_reboot_before.stdout }}
      avant toute écriture de ce rôle : une modification firmware est déjà
      en attente (d'une source antérieure, hors de ce rôle). Continuer
      rendrait la confirmation post-écriture inexploitable — impossible de
      distinguer ce pending_reboot de celui que produirait cette exécution.
      Redémarrer d'abord pour purger l'état en attente, puis relancer.
    success_msg: "pending_reboot = 0, aucune bascule déjà en attente."

# --- Instantané pré-bascule (trace non versionnée) ----------------------

- name: Relever les connecteurs DRM par carte
  ansible.builtin.shell:
    cmd: >-
      for f in /sys/class/drm/card*-*/status; do
      printf '%s: %s\n' "$f" "$(cat "$f")"; done
  register: gpu_mux_drm_status
  changed_when: false
  check_mode: false

- name: Relever /dev/dri/by-path/
  ansible.builtin.command:
    cmd: ls -la /dev/dri/by-path/
  register: gpu_mux_dri_by_path
  changed_when: false
  check_mode: false

- name: Relever la sortie nvidia-smi
  ansible.builtin.command:
    cmd: nvidia-smi
  register: gpu_mux_nvidia_smi
  changed_when: false
  check_mode: false
  failed_when: false

- name: Relever la sortie kscreen-doctor -o (modes et sortie active)
  ansible.builtin.command:
    cmd: kscreen-doctor -o
  register: gpu_mux_kscreen
  changed_when: false
  check_mode: false
  failed_when: false

- name: Assembler l'instantané d'état avant bascule
  ansible.builtin.set_fact:
    gpu_mux_pre_state:
      horodatage: "{{ ansible_facts.date_time.iso8601 }}"
      gpu_mux_mode_current_value_avant: "{{ gpu_mux_mode_current.stdout }}"
      gpu_mux_target_value: "{{ gpu_mux_target_value }}"
      pending_reboot_avant: "{{ gpu_mux_pending_reboot_before.stdout }}"
      dgpu_disable_value: "{{ gpu_mux_dgpu_disable_value }}"
      connecteurs_drm: "{{ gpu_mux_drm_status.stdout_lines }}"
      dev_dri_by_path: "{{ gpu_mux_dri_by_path.stdout_lines }}"
      nvidia_smi: "{{ gpu_mux_nvidia_smi.stdout_lines }}"
      kscreen_doctor: "{{ gpu_mux_kscreen.stdout_lines }}"

- name: S'assurer que le répertoire de trace existe (non versionné)
  ansible.builtin.file:
    path: "{{ gpu_mux_trace_dir }}"
    state: directory
    mode: "0700"

- name: Écrire l'instantané d'état avant bascule dans le fichier de trace
  ansible.builtin.copy:
    content: "{{ gpu_mux_pre_state | to_nice_json }}\n"
    dest: "{{ gpu_mux_trace_dir }}/pre-bascule-{{ ansible_facts.date_time.iso8601_basic_short }}.json"
    mode: "0600"
  register: gpu_mux_trace_file

# --- Écriture de la valeur cible -----------------------------------------
# Chemin retenu : écriture directe dans current_value, PAS asusctl armoury
# set. Révocation partielle de D2ter (2026-08-05, voir docs/machine-facts.md
# § Décisions) : asusd met gpu_mux_mode en file d'attente mémoire pour
# application différée par asus-shutdown.service — unité désactivée sur ce
# système, donc jamais consommée, et pending_reboot reste à 0 même quand la
# demande a été acceptée par asusd (code retour 0). Cette indirection
# échangeait une confirmation vérifiable contre une intention non
# persistée. Le refus de supergfxd (motif d'origine de D2ter) est
# MAINTENU : l'écriture directe l'évite tout autant qu'asusctl le faisait.
# Le fichier cible est root:root 0644 : cette tâche seule requiert
# `become: true` (sudo), aucune autre tâche de ce rôle n'a besoin de
# privilège puisque les autres attributs ne sont que lus. Jamais exécutée
# en --check : Ansible ignore par défaut les tâches command/shell sous
# --check sauf check_mode:false, qu'on évite ICI volontairement
# (contrairement aux lectures ci-dessus) pour que --check ne puisse jamais
# écrire.

- name: >-
    Écrire directement la valeur cible dans gpu_mux_mode/current_value
    (jamais en mode --check)
  ansible.builtin.shell:
    cmd: "echo {{ gpu_mux_target_value }} > {{ gpu_mux_mode_dir }}/current_value"
  become: true
  register: gpu_mux_write_result
  changed_when: true
  when: not ansible_check_mode

# --- Confirmation post-écriture : pending_reboot, jamais current_value --
# Ne PAS relire gpu_mux_mode/current_value ici pour "confirmer" l'écriture
# — voir CLAUDE.md § Matériel spécifique — GPU / MUX pour ce que
# current_value reflète exactement avant reboot (règle corrigée le
# 2026-08-05 ; ce fichier ne la recopie pas, une règle vit à un seul
# endroit). La confirmation valide avant reboot est le passage de
# pending_reboot de 0 à 1 — c'est pour cela qu'aucune tâche ci-dessous ne
# relit current_value après l'écriture.

- name: Relire pending_reboot après écriture (uniquement hors --check)
  ansible.builtin.command:
    cmd: "cat {{ gpu_mux_pending_reboot_path }}"
  register: gpu_mux_pending_reboot_after
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: >-
    Confirmer la bascule par pending_reboot (0 → 1) — PAS par une relecture
    de current_value, voir le commentaire ci-dessus
  ansible.builtin.assert:
    that:
      - gpu_mux_pending_reboot_after.stdout | string == "1"
    fail_msg: >-
      pending_reboot vaut toujours {{ gpu_mux_pending_reboot_after.stdout }}
      après l'écriture directe ({{ gpu_mux_write_result.rc | default('?') }}) :
      contrairement à la voie asusctl (révoquée le 2026-08-05, voir D2ter
      dans docs/machine-facts.md), il n'y a plus d'indirection en file
      d'attente entre cette tâche et le firmware — si pending_reboot ne
      passe pas à 1 ici, l'écriture n'a probablement pas eu lieu. Ne PAS
      contourner en relisant gpu_mux_mode/current_value : son comportement
      exact avant reboot est documenté dans CLAUDE.md § Matériel
      spécifique — GPU / MUX (règle corrigée le 2026-08-05), pas ici — une
      relecture immédiate ne remplace pas pending_reboot comme
      confirmation. Vérifier la sortie de la tâche d'écriture ci-dessus
      (code retour, `become` a-t-il pu s'élever ?) avant de relancer — ne
      PAS tenter de contournement.
    success_msg: >-
      pending_reboot est passé de {{ gpu_mux_pending_reboot_before.stdout }}
      à {{ gpu_mux_pending_reboot_after.stdout }} : écriture directe
      confirmée par le firmware, EN ATTENTE DE REDÉMARRAGE.
  when: not ansible_check_mode

# --- Rapport final --------------------------------------------------------
# La bascule n'est prouvée qu'après redémarrage : ce rôle ne se déclare
# jamais en succès sur la seule écriture. Le message dit explicitement
# « en attente de redémarrage », jamais « appliqué ».

- name: Rapporter l'état (mode simulation --check)
  ansible.builtin.debug:
    msg: >-
      --check : aucune écriture réalisée, aucun redémarrage nécessaire.
      gpu_mux_mode resterait à {{ gpu_mux_mode_current.stdout }},
      pending_reboot à {{ gpu_mux_pending_reboot_before.stdout }}. Instantané
      d'état écrit à titre de test dans
      {{ gpu_mux_trace_file.dest | default('(chemin non résolu en --check)') }}.
  when: ansible_check_mode

- name: Rapporter l'état (exécution réelle)
  ansible.builtin.debug:
    msg:
      - "BASCULE EN ATTENTE DE REDÉMARRAGE — PAS APPLIQUÉE tant que la machine n'a pas redémarré."
      - "gpu_mux_mode/current_value avant écriture :
         {{ gpu_mux_mode_current.stdout }} (voir CLAUDE.md § Matériel
         spécifique — GPU / MUX pour ce que current_value reflète avant
         reboot)."
      - "pending_reboot : {{ gpu_mux_pending_reboot_before.stdout }} → {{ gpu_mux_pending_reboot_after.stdout }}."
      - "dgpu_disable (jamais écrit par ce rôle) : {{ gpu_mux_dgpu_disable_value }}."
      - "Instantané pré-bascule : {{ gpu_mux_trace_file.dest }}."
      - "Chemin de retour avant tout redémarrage : docs/gpu-mux-recovery.md (TTY local, SSH entrant via roles/recovery/)."
      - "Prochaine étape : redémarrage — décision manuelle, hors de ce rôle."
  when: not ansible_check_mode
