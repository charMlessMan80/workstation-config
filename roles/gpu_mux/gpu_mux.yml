---
# Playbook d'exécution/test du rôle gpu_mux, ciblant localhost — même
# patron que roles/recovery/recovery.yml. Ce rôle NE REDÉMARRE JAMAIS la
# machine : il écrit gpu_mux_mode et s'arrête après vérification de
# pending_reboot. Le redémarrage reste un acte manuel, hors de ce playbook.
- name: gpu_mux — bascule vers Optimus/Hybrid via asus-armoury (D2bis/D2ter)
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: "{{ playbook_dir }}"
