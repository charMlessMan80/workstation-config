---
# Playbook d'exécution/test du rôle android_jdk, ciblant localhost.
# `role: "{{ playbook_dir }}"` charge ce répertoire lui-même comme rôle
# (tasks/, defaults/, meta/ y sont déjà en place) — même patron que
# roles/recovery/recovery.yml, pris pour modèle de ce rôle.
- name: Android JDK — installe le JDK complet pour la chaîne Android CLI
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: "{{ playbook_dir }}"
